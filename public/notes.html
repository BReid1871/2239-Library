<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes — Ritual Library</title>
<script src="theme-init.js"></script>
<link rel="stylesheet" href="shared.css">
<style>
.note-card { background: var(--bg2); border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px; cursor: pointer; transition: all 0.1s; }
.note-card:hover { border-color: var(--accent); }
.note-card.selected { border-color: var(--accent); background: var(--bg); }
.note-card-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note-card-preview { font-size: 11px; color: var(--text3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note-card-date { font-size: 10px; color: var(--text3); margin-top: 3px; }
.note-editor { display: flex; flex-direction: column; gap: 10px; }
.note-title-input { font-size: 16px; font-weight: 500; border: none; border-bottom: 0.5px solid var(--border); padding: 4px 0; background: transparent; color: var(--text); outline: none; width: 100%; }
.note-title-input:focus { border-bottom-color: var(--accent); }
.note-body-input { flex: 1; border: none; background: transparent; color: var(--text); font-size: 14px; font-family: inherit; line-height: 1.7; outline: none; resize: none; min-height: 300px; }
.note-meta { font-size: 11px; color: var(--text3); }

/* Links */
.note-links-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; position: relative; }
.link-chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 6px 3px 10px; border-radius: 99px; font-size: 12px; background: var(--bg2); border: 0.5px solid var(--border2); color: var(--text2); }
.link-chip a { color: var(--text2); text-decoration: none; cursor: pointer; }
.link-chip a:hover { color: var(--accent); }
.link-chip-type { font-size: 9px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.03em; }
.link-chip-remove { border: none; background: none; color: var(--text3); cursor: pointer; font-size: 13px; line-height: 1; padding: 0 2px; }
.link-chip-remove:hover { color: var(--text); }
.add-link-btn { font-size: 11px; padding: 3px 9px; }
.link-picker { position: absolute; top: 100%; left: 0; margin-top: 6px; width: 280px; max-height: 320px; background: var(--bg); border: 0.5px solid var(--border2); border-radius: var(--radius); box-shadow: 0 4px 16px rgba(0,0,0,0.15); z-index: 30; display: flex; flex-direction: column; }
.link-picker-tabs { display: flex; border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
.link-picker-tab { flex: 1; text-align: center; font-size: 11px; padding: 6px 4px; cursor: pointer; color: var(--text3); border-bottom: 2px solid transparent; }
.link-picker-tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 500; }
.link-picker-search { padding: 6px 8px; border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
.link-picker-search input { font-size: 12px; padding: 5px 8px; }
.link-picker-results { overflow-y: auto; padding: 4px; }
.link-picker-item { padding: 6px 8px; border-radius: 5px; cursor: pointer; font-size: 12px; }
.link-picker-item:hover { background: var(--bg2); }
.link-picker-empty { font-size: 11px; color: var(--text3); padding: 10px 8px; text-align: center; }
</style>
</head>
<body>
<div class="page-wrap">
  <div class="tabs" id="nav"></div>

  <div style="display:flex;gap:1.5rem;align-items:flex-start;">
    <!-- Note list -->
    <div style="width:200px;flex-shrink:0;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <span style="font-size:13px;font-weight:500;">Notes</span>
        <button class="primary" onclick="newNote()" style="font-size:11px;padding:3px 10px;">+ New</button>
      </div>
      <div id="note-list"></div>
    </div>
    <!-- Note editor -->
    <div style="flex:1;min-width:0;" id="note-editor-area">
      <div class="notes-empty">Select a note or create a new one.</div>
    </div>
  </div>
</div>

<script src="reference-data.js"></script>
<script src="shared.js"></script>
<script>
renderNav('nav', 'notes', [], function() {});

// ── Data ─────────────────────────────────────────────────────────────────────

var notes = [];
async function loadNotes() { notes = await api('GET', '/api/notes'); }

// Read-only: loaded so link chips can resolve labels and the picker can
// search, same read-only pattern index.html uses for arraysForBacklinks.
var linkableRituals = [];
var linkableArrays = [];
var linkableComponents = [];
async function loadLinkables() {
  var results = await Promise.all([
    api('GET', '/api/rituals'),
    api('GET', '/api/arrays'),
    api('GET', '/api/components'),
  ]);
  linkableRituals = results[0];
  linkableArrays = results[1];
  linkableComponents = (window.COMPONENTS || []).concat(results[2]);
}

var currentNoteId = null;
var linkPickerType = 'ritual';
var linkPickerOpen = false;

async function newNote() {
  var created = await api('POST', '/api/notes', { title: 'Untitled note', body: '' });
  await loadNotes();
  renderNoteList();
  openNote(created.id);
}

async function deleteNote(id) {
  await api('DELETE', '/api/notes/' + id);
  await loadNotes();
  if (currentNoteId === id) {
    currentNoteId = null;
    document.getElementById('note-editor-area').innerHTML = '<div class="notes-empty">Select a note or create a new one.</div>';
  }
  renderNoteList();
}

function renderNoteList() {
  var el = document.getElementById('note-list');
  if (!el) return;
  el.innerHTML = '';
  if (notes.length === 0) {
    el.innerHTML = '<div style="font-size:12px;color:var(--text3);text-align:center;padding:1rem 0;">No notes yet.</div>';
    return;
  }
  notes.forEach(function(n) {
    var card = document.createElement('div');
    card.className = 'note-card' + (n.id === currentNoteId ? ' selected' : '');
    var title = document.createElement('div'); title.className = 'note-card-title'; title.textContent = n.title || 'Untitled note';
    var preview = document.createElement('div'); preview.className = 'note-card-preview'; preview.textContent = (n.body || '').slice(0, 60) || 'Empty note';
    var date = document.createElement('div'); date.className = 'note-card-date';
    date.textContent = new Date(n.updatedAt || n.updated_at).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
    card.appendChild(title); card.appendChild(preview); card.appendChild(date);
    card.onclick = function() { openNote(n.id); };
    el.appendChild(card);
  });
}

var saveNoteDebounced = debounce(function(id, patch) {
  api('PUT', '/api/notes/' + id, patch).then(function(updated) {
    var idx = notes.findIndex(function(n) { return n.id === id; });
    if (idx >= 0) notes[idx] = updated;
    renderNoteList();
  }).catch(function(e) { console.error('Failed to save note', e); });
}, 400);

// ── Links ────────────────────────────────────────────────────────────────────

function linkEquals(a, b) {
  if (a.type !== b.type) return false;
  if (a.type === 'component') return a.rune === b.rune && a.name === b.name;
  return a.id === b.id;
}

function linkLabel(link) {
  if (link.type === 'ritual') {
    var r = linkableRituals.filter(function(x) { return x.id === link.id; })[0];
    return r ? r.name : null;
  }
  if (link.type === 'array') {
    var a = linkableArrays.filter(function(x) { return x.id === link.id; })[0];
    return a ? a.name : null;
  }
  if (link.type === 'component') {
    var c = linkableComponents.filter(function(x) { return x.rune === link.rune && x.name === link.name; })[0];
    return c ? c.name : null;
  }
  return null;
}

function linkHref(link) {
  if (link.type === 'ritual') return 'index.html?open=' + encodeURIComponent(link.id);
  if (link.type === 'array') return 'arrays.html?open=' + encodeURIComponent(link.id);
  return 'index.html?compRune=' + encodeURIComponent(link.rune) + '&compName=' + encodeURIComponent(link.name);
}

function saveNoteLinksNow(id, links) {
  return api('PUT', '/api/notes/' + id, { links: links }).then(function(updated) {
    var idx = notes.findIndex(function(nn) { return nn.id === id; });
    if (idx >= 0) notes[idx] = updated;
  });
}

function outsideLinkPickerClick(e) {
  var picker = document.getElementById('link-picker');
  if (picker && !picker.contains(e.target) && !e.target.classList.contains('add-link-btn')) closeLinkPicker();
}

function closeLinkPicker() {
  var picker = document.getElementById('link-picker');
  if (picker) picker.parentNode.removeChild(picker);
  document.removeEventListener('click', outsideLinkPickerClick);
}

function toggleLinkPicker(row, n) {
  if (document.getElementById('link-picker')) { closeLinkPicker(); return; }
  linkPickerType = 'ritual';
  var picker = document.createElement('div');
  picker.id = 'link-picker';
  picker.className = 'link-picker';
  row.appendChild(picker);
  renderLinkPicker(n);
  setTimeout(function() { document.addEventListener('click', outsideLinkPickerClick); }, 0);
}

function linkPickerItems(type) {
  if (type === 'ritual') return linkableRituals.map(function(r) { return { label: r.name, link: { type: 'ritual', id: r.id } }; });
  if (type === 'array') return linkableArrays.map(function(a) { return { label: a.name, link: { type: 'array', id: a.id } }; });
  return linkableComponents.map(function(c) { return { label: c.name + ' (' + c.rune + ')', link: { type: 'component', rune: c.rune, name: c.name } }; });
}

function renderLinkPicker(n) {
  var picker = document.getElementById('link-picker');
  if (!picker) return;
  picker.innerHTML = '';

  var tabs = document.createElement('div');
  tabs.className = 'link-picker-tabs';
  [['ritual', 'Rituals'], ['array', 'Arrays'], ['component', 'Components']].forEach(function(t) {
    var tab = document.createElement('div');
    tab.className = 'link-picker-tab' + (linkPickerType === t[0] ? ' active' : '');
    tab.textContent = t[1];
    tab.onclick = function() { linkPickerType = t[0]; renderLinkPicker(n); };
    tabs.appendChild(tab);
  });
  picker.appendChild(tabs);

  var searchWrap = document.createElement('div');
  searchWrap.className = 'link-picker-search';
  var search = document.createElement('input');
  search.type = 'text';
  search.placeholder = 'Search…';
  searchWrap.appendChild(search);
  picker.appendChild(searchWrap);

  var results = document.createElement('div');
  results.className = 'link-picker-results';
  picker.appendChild(results);

  search.oninput = function() { renderLinkPickerResults(n, results, search.value); };
  renderLinkPickerResults(n, results, '');
  search.focus();
}

function renderLinkPickerResults(n, resultsEl, q) {
  resultsEl.innerHTML = '';
  var qLower = q.toLowerCase();
  var items = linkPickerItems(linkPickerType).filter(function(it) {
    if ((n.links || []).some(function(l) { return linkEquals(l, it.link); })) return false;
    return !qLower || it.label.toLowerCase().indexOf(qLower) >= 0;
  });
  if (items.length === 0) {
    resultsEl.innerHTML = '<div class="link-picker-empty">No matches.</div>';
    return;
  }
  items.forEach(function(it) {
    var item = document.createElement('div');
    item.className = 'link-picker-item';
    item.textContent = it.label;
    item.onclick = function() {
      n.links = (n.links || []).concat([it.link]);
      closeLinkPicker();
      saveNoteLinksNow(n.id, n.links).then(function() { openNote(n.id); });
    };
    resultsEl.appendChild(item);
  });
}

function renderLinksRow(n) {
  var row = document.createElement('div');
  row.className = 'note-links-row';

  (n.links || []).forEach(function(link) {
    var label = linkLabel(link);
    if (!label) return; // target deleted since the link was made — skip it
    var chip = document.createElement('span');
    chip.className = 'link-chip';
    var typeEl = document.createElement('span');
    typeEl.className = 'link-chip-type';
    typeEl.textContent = link.type;
    var a = document.createElement('a');
    a.href = linkHref(link);
    a.textContent = label;
    chip.appendChild(typeEl);
    chip.appendChild(a);
    var rm = document.createElement('button');
    rm.className = 'link-chip-remove';
    rm.textContent = '×';
    rm.onclick = function() {
      n.links = (n.links || []).filter(function(l) { return !linkEquals(l, link); });
      saveNoteLinksNow(n.id, n.links).then(function() { openNote(n.id); });
    };
    chip.appendChild(rm);
    row.appendChild(chip);
  });

  var addBtn = document.createElement('button');
  addBtn.className = 'add-link-btn';
  addBtn.textContent = '+ Link';
  addBtn.onclick = function(e) { e.stopPropagation(); toggleLinkPicker(row, n); };
  row.appendChild(addBtn);

  return row;
}

function openNote(id) {
  var n = null;
  for (var i = 0; i < notes.length; i++) { if (notes[i].id === id) { n = notes[i]; break; } }
  if (!n) return;
  currentNoteId = id;
  renderNoteList();

  var area = document.getElementById('note-editor-area');
  area.innerHTML = '';

  var editor = document.createElement('div');
  editor.className = 'note-editor';

  var titleInput = document.createElement('input');
  titleInput.type = 'text';
  titleInput.className = 'note-title-input';
  titleInput.placeholder = 'Note title…';
  titleInput.value = n.title || '';
  titleInput.oninput = function() {
    n.title = titleInput.value;
    saveNoteDebounced(id, { title: n.title, body: n.body });
  };

  var bodyInput = document.createElement('textarea');
  bodyInput.className = 'note-body-input';
  bodyInput.placeholder = 'Write your note here…';
  bodyInput.value = n.body || '';
  bodyInput.oninput = function() {
    n.body = bodyInput.value;
    saveNoteDebounced(id, { title: n.title, body: n.body });
  };

  var meta = document.createElement('div');
  meta.className = 'note-meta';
  var updated = new Date(n.updatedAt || n.updated_at);
  meta.textContent = 'Last updated ' + updated.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}) + ' at ' + updated.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});

  var actionRow = document.createElement('div');
  actionRow.style.cssText = 'display:flex;gap:6px;margin-top:1rem;';

  var undoBtn = document.createElement('button');
  undoBtn.textContent = '↶ Undo';
  undoBtn.title = 'Undo last edit';
  undoBtn.style.fontSize = '12px';
  undoBtn.onclick = function() { noteHistoryAction(id, 'undo'); };

  var redoBtn = document.createElement('button');
  redoBtn.textContent = '↷ Redo';
  redoBtn.title = 'Redo';
  redoBtn.style.fontSize = '12px';
  redoBtn.onclick = function() { noteHistoryAction(id, 'redo'); };

  var delBtn = document.createElement('button');
  delBtn.className = 'danger';
  delBtn.textContent = 'Delete note';
  delBtn.style.fontSize = '12px';
  delBtn.onclick = function() { if (confirm('Delete this note?')) deleteNote(id); };

  actionRow.appendChild(undoBtn);
  actionRow.appendChild(redoBtn);
  actionRow.appendChild(delBtn);

  var historyMsg = document.createElement('div');
  historyMsg.id = 'note-history-msg';
  historyMsg.style.cssText = 'font-size:11px;color:var(--text3);min-height:1.2em;margin-top:4px;';

  editor.appendChild(titleInput);
  editor.appendChild(renderLinksRow(n));
  editor.appendChild(bodyInput);
  editor.appendChild(meta);
  editor.appendChild(actionRow);
  editor.appendChild(historyMsg);
  area.appendChild(editor);
  titleInput.focus();
}

async function noteHistoryAction(id, action) {
  saveNoteDebounced.cancel();
  try {
    await api('POST', '/api/notes/' + id + '/' + action);
  } catch (e) {
    var msg = document.getElementById('note-history-msg');
    if (msg) msg.textContent = e.message;
    return;
  }
  await loadNotes();
  openNote(id);
}

// ── Init ─────────────────────────────────────────────────────────────────────

async function init() {
  await Promise.all([loadNotes(), loadLinkables()]);
  renderNoteList();
  var openId = new URLSearchParams(window.location.search).get('open');
  if (openId && notes.some(function(n) { return n.id === openId; })) openNote(openId);
}
init();
</script>
</body>
</html>
