<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arrays — Ritual Library</title>
<script src="theme-init.js"></script>
<link rel="stylesheet" href="shared.css">
<style>
.array-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 8px 10px; margin-bottom: 6px; cursor: pointer; transition: all 0.1s; }
.array-card:hover { border-color: var(--accent); }
.array-card.selected { border-color: var(--accent); background: var(--bg); }
.array-card-title { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.array-card-meta { font-size: 10px; color: var(--text3); margin-top: 1px; }
.hex-board-wrap { flex: 1; overflow: auto; border: 0.5px solid var(--border2); border-radius: var(--radius); background: var(--bg2); position: relative; min-width: 0; }
.hex-cell { fill: var(--bg); stroke: var(--border2); stroke-width: 1; cursor: pointer; transition: fill 0.1s, stroke 0.1s; }
.hex-cell:hover { stroke: var(--accent); }
.hex-cell.occupied { cursor: default; }
.hex-cell.preview-range { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 2 2; }
.hex-cell.preview-footprint { fill: var(--accent); fill-opacity: 0.35; stroke: var(--accent); stroke-width: 2; }
.hex-reach-line { stroke: var(--accent); stroke-width: 1.5; opacity: 0.55; pointer-events: none; }
.hex-reach-line.anti { stroke: #dc2626; stroke-dasharray: 4 3; }
.hex-arrowhead { fill: var(--accent); opacity: 0.55; }
.hex-arrowhead.anti { fill: #dc2626; }
.hex-order-badge circle { fill: var(--accent); stroke: var(--bg2); stroke-width: 1.5; }
.hex-order-badge.anti circle { fill: #dc2626; }
.hex-order-badge text { fill: #fff; font-size: 9px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
.effector-tag { font-size: 10px; padding: 1px 8px; }
.anti-effector-tag { font-size: 10px; padding: 1px 8px; }
.anti-effector-tag.on { border-color: #dc2626; color: #dc2626; }
.non-triggerable-badge { font-size: 10px; padding: 1px 8px; background: var(--bg2); color: var(--text3); border: 0.5px solid var(--border); border-radius: 99px; }
.simulation-panel { border: 0.5px solid var(--border); border-radius: var(--radius); background: var(--bg2); flex-shrink: 0; margin-top: 8px; max-height: 220px; overflow-y: auto; }
.simulation-entry { border-bottom: 0.5px solid var(--border); }
.simulation-entry:last-child { border-bottom: none; }
.simulation-entry-header { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; cursor: pointer; user-select: none; font-size: 12px; }
.simulation-entry-header:hover { color: var(--accent); }
.simulation-entry-body { padding: 0 10px 8px; font-size: 11px; }
.simulation-warning { color: #dc2626; margin: 2px 0 6px; }
.simulation-roster-item { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
.simulation-roster-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.simulation-roster-dot.active { background: var(--accent); }
.simulation-roster-dot.inactive { background: var(--border2); }
.simulation-empty { font-size: 11px; color: var(--text3); padding: 8px 10px; }
.placement-list { width: 210px; flex-shrink: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.placement-item { display: flex; align-items: flex-start; gap: 6px; padding: 7px 9px; border-radius: var(--radius); background: var(--bg2); border: 0.5px solid var(--border); }
.placement-item-body { flex: 1; min-width: 0; }
.placement-item-name { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.placement-item-meta { font-size: 10px; color: var(--text3); margin-top: 1px; }
.placement-item-size { display: flex; align-items: center; gap: 5px; margin-top: 5px; }
.placement-item-size button { padding: 1px 6px; font-size: 11px; }
.placement-item-size span { font-size: 11px; color: var(--text2); min-width: 44px; }
.picker-size-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 0.5px solid var(--border); font-size: 11px; color: var(--text3); }
.picker-size-row button { padding: 1px 7px; font-size: 12px; }
.picker-size-row span { font-size: 12px; color: var(--text); min-width: 14px; text-align: center; }
.placement-item-actions { display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; }
.placement-item-actions button { font-size: 10px; padding: 1px 7px; }
.placement-empty { font-size: 11px; color: var(--text3); text-align: center; padding: 1rem 0.5rem; }
.array-picker { position: fixed; background: var(--bg); border: 0.5px solid var(--border2); border-radius: var(--radius-lg); box-shadow: 0 8px 24px rgba(0,0,0,0.18); z-index: 999; width: 240px; max-height: 380px; display: flex; flex-direction: column; }
.array-picker-search { padding: 8px 10px; border-bottom: 0.5px solid var(--border); }
.array-picker-search input { width: 100%; padding: 5px 8px; font-size: 12px; border: 0.5px solid var(--border2); border-radius: 5px; background: var(--bg2); color: var(--text); outline: none; }
.array-picker-list { flex: 1; overflow-y: auto; padding: 6px; }
.array-picker-item { padding: 6px 8px; border-radius: 5px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 6px; }
.array-picker-item:hover { background: var(--bg2); }
.array-picker-item-name { flex: 1; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.array-picker-item-meta { font-size: 10px; color: var(--text3); }
.array-picker-empty { font-size: 12px; color: var(--text3); text-align: center; padding: 1rem; }
.array-picker-error { font-size: 11px; color: #dc2626; text-align: center; padding: 0 10px 8px; }
.array-picker-cancel { padding: 6px; border-top: 0.5px solid var(--border); text-align: center; }
.array-picker-cancel button { font-size: 11px; }
.array-grid-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.array-name-input { font-size: 15px; font-weight: 500; border: none; border-bottom: 0.5px solid var(--border); padding: 2px 0; background: transparent; color: var(--text); outline: none; flex: 1; }
.array-name-input:focus { border-bottom-color: var(--accent); }
#ritual-preview-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 1000; }
#ritual-preview-overlay .card { max-width: 420px; width: 90vw; background: var(--bg); }
</style>
</head>
<body>
<div class="page-wrap">
  <div class="tabs" id="nav"></div>

  <div style="display:flex;align-items:flex-start;gap:1.5rem;height:calc(100vh - 160px);">

    <!-- Left: array list + controls -->
    <div style="width:200px;flex-shrink:0;display:flex;flex-direction:column;gap:10px;height:100%;overflow:hidden;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <span style="font-size:13px;font-weight:500;">Arrays</span>
        <button class="primary" onclick="newArray()" style="font-size:11px;padding:3px 10px;">+ New</button>
      </div>
      <div id="array-list" style="flex:1;overflow-y:auto;"></div>
    </div>

    <!-- Right: array editor -->
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;height:100%;" id="array-editor-area">
      <div class="notes-empty">Select an array or create a new one.</div>
    </div>

  </div>
</div>

<script src="reference-data.js"></script>
<script src="hex.js"></script>
<script src="simulation.js"></script>
<script src="shared.js"></script>
<script>
renderNav('nav', 'arrays', [], function() {});

// ── Data ─────────────────────────────────────────────────────────────────────

var library = [];
var arrays = [];
async function loadLibrary() { library = await api('GET', '/api/rituals'); }
async function loadArrays() { arrays = await api('GET', '/api/arrays'); }

function getRitualById(id) {
  for (var i = 0; i < library.length; i++) { if (library[i].id === id) return library[i]; }
  return null;
}

// ── Ritual preview (read-only — full detail/edit lives on the Add Ritual page) ─

function openRitualPreview(id) {
  var r = getRitualById(id);
  if (!r) return;
  closeRitualPreview();

  var pr = getRune(r.primary);
  var ignored = IGNORES[r.primary] || [];
  var subs = r.subs || [];
  var activeSubs = subs.filter(function(s) { return ignored.indexOf(s) < 0; });
  var tc = TIER_COLORS[r.tier] || '#999';

  var chipHTML = '';
  if (pr) chipHTML += '<span class="rune-chip"><span class="dot" style="background:' + pr.color + '"></span>' + esc(r.primary) + '</span>';
  activeSubs.forEach(function(s) {
    var sr = getRune(s);
    chipHTML += '<span class="rune-chip" style="color:var(--text3)">+ <span class="dot" style="background:' + (sr ? sr.color : '#ccc') + '"></span>' + esc(s) + '</span>';
  });

  var html = '<div class="card">';
  html += '<div class="detail-top">';
  html += '<div><div class="ritual-name">' + esc(r.name) + '</div>';
  html += '<div>';
  html += '<span class="badge" style="background:' + tc + '22;color:' + tc + ';border:0.5px solid ' + tc + '44">' + r.tier + '</span>';
  html += '<span class="badge" style="background:var(--bg2);color:var(--text2);border:0.5px solid var(--border)">' + esc(r.purpose) + '</span>';
  if (r.triggerable === false) {
    html += '<span class="badge" style="background:var(--bg2);color:var(--text3);border:0.5px solid var(--border)">Non-triggerable</span>';
  }
  html += '</div></div>';
  html += '<button id="ritual-preview-close">Close</button>';
  html += '</div>';
  html += '<div class="rune-row">' + chipHTML + '</div>';
  html += '<hr class="hdivider">';
  html += '<div class="fl">Effect</div><div class="fv">' + esc(r.effect || '') + '</div>';
  var d = new Date(r.createdAt);
  html += '<div style="margin-top:0.5rem;font-size:11px;color:var(--text3)">Added ' + d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}) + ' · ' + subs.length + ' subsidiary rune' + (subs.length !== 1 ? 's' : '') + '</div>';
  html += '</div>';

  var overlay = document.createElement('div');
  overlay.id = 'ritual-preview-overlay';
  overlay.innerHTML = html;
  overlay.onclick = function(e) { if (e.target === overlay) closeRitualPreview(); };
  document.body.appendChild(overlay);
  document.getElementById('ritual-preview-close').onclick = closeRitualPreview;
}

function closeRitualPreview() {
  var overlay = document.getElementById('ritual-preview-overlay');
  if (overlay) overlay.parentNode.removeChild(overlay);
}

// ── Arrays ───────────────────────────────────────────────────────────────────

var currentArrayId = null;
var HEX_PIXEL_SIZE = 26;

// Reach-line drawing tuning (all in the board's unscaled pixel space, so
// they scale along with zoom): how far apart to draw two opposite-direction
// arrows between a mutual pair, and how far to pull each end back from a
// hex's center so a line/arrowhead doesn't dive into the hex fill.
var REACH_OFFSET_PX = 5;
var REACH_START_PAD = 12;
var REACH_END_PAD = 20;

var MIN_ZOOM = 0.1;
var MAX_ZOOM = 2;
var ZOOM_STEP = 0.1;
var zoomLevel = 1;

var resolutionLogOpen = true;

function getArray(id) {
  for (var i = 0; i < arrays.length; i++) { if (arrays[i].id === id) return arrays[i]; }
  return null;
}

function saveArray(arr) {
  api('PUT', '/api/arrays/' + arr.id, { name: arr.name, radius: arr.radius, placements: arr.placements })
    .catch(function(e) { console.error('Failed to save array', e); });
}

var saveArrayDebounced = debounce(saveArray, 400);

async function newArray() {
  var created = await api('POST', '/api/arrays', { name: 'Untitled Array', radius: 3, placements: [] });
  await loadArrays();
  renderArrayList();
  openArray(created.id);
}

// Fresh placement ids on the copy, same as a brand-new placement would get
// — keeps the two arrays' placements independently editable.
async function duplicateArray(id) {
  var arr = getArray(id);
  if (!arr) return;
  var clonedPlacements = (arr.placements || []).map(function(p) {
    return Object.assign({}, p, { id: crypto.randomUUID() });
  });
  var created = await api('POST', '/api/arrays', {
    name: arr.name + ' (copy)', radius: arr.radius, placements: clonedPlacements,
  });
  await loadArrays();
  renderArrayList();
  openArray(created.id);
}

async function deleteArray(id) {
  var arr = getArray(id);
  if (!arr || !confirm('Delete array "' + arr.name + '"?')) return;
  await api('DELETE', '/api/arrays/' + id);
  await loadArrays();
  if (currentArrayId === id) {
    currentArrayId = null;
    document.getElementById('array-editor-area').innerHTML = '<div class="notes-empty">Select an array or create a new one.</div>';
  }
  renderArrayList();
}

function renderArrayList() {
  var el = document.getElementById('array-list');
  if (!el) return;
  el.innerHTML = '';
  if (arrays.length === 0) {
    el.innerHTML = '<div style="font-size:12px;color:var(--text3);text-align:center;padding:1rem 0;">No arrays yet.</div>';
    return;
  }
  arrays.forEach(function(arr) {
    var card = document.createElement('div');
    card.className = 'array-card' + (arr.id === currentArrayId ? ' selected' : '');
    var title = document.createElement('div'); title.className = 'array-card-title'; title.textContent = arr.name;
    var count = (arr.placements || []).length;
    var meta = document.createElement('div'); meta.className = 'array-card-meta';
    meta.textContent = 'Radius ' + arr.radius + ' · ' + count + ' ritual' + (count !== 1 ? 's' : '');
    card.appendChild(title); card.appendChild(meta);
    card.onclick = function() { openArray(arr.id); };
    el.appendChild(card);
  });
}

function openArray(id) {
  var arr = getArray(id);
  if (!arr) return;
  currentArrayId = id;
  zoomLevel = 1;
  simulationOpenIds = {};
  renderArrayList();
  renderArrayEditor(arr);
}

// ── Hex board helpers ────────────────────────────────────────────────────────

// Placements whose ritual still exists, each with its footprint hexes and
// range — a ritual can be deleted from the library after being placed, and
// (matching how deleted rituals were already handled before this feature)
// a placement pointing at a missing ritual is simply skipped everywhere.
// Size lives on the placement, not the ritual — the same ritual can be
// placed at different sizes.
function livePlacements(arr) {
  var out = [];
  (arr.placements || []).forEach(function(p) {
    var ritual = getRitualById(p.ritualId);
    if (!ritual) return;
    var size = p.size || 1;
    out.push({
      placement: p,
      ritual: ritual,
      size: size,
      anchor: { q: p.q, r: p.r },
      footprint: Hex.footprintHexes({ q: p.q, r: p.r }, size),
      range: Hex.rangeForSize(size),
    });
  });
  return out;
}

function occupiedHexMap(placements) {
  var map = {};
  placements.forEach(function(entry) {
    entry.footprint.forEach(function(hex) {
      map[Hex.keyOf(hex)] = entry;
    });
  });
  return map;
}

// Every directed "reach": an effector or anti-effector placement's effect
// touches another placement's anchor within its range (see the per-placement
// toggle in the sidebar) — most rituals in an array just sit there and can
// be reached, but don't reach out themselves. Purely geometric, independent
// of any activation state — see simulation.js's computeReaches for details,
// shared with the Simulations panel below so the board and the simulation
// never disagree about what reaches what.
function computeReaches(placements) {
  return Simulation.computeReaches(placements);
}

function svgEl(tag, attrs) {
  var el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.keys(attrs || {}).forEach(function(k) { el.setAttribute(k, attrs[k]); });
  return el;
}

function renderHexBoard(arr, placements, zoom, reaches) {
  var boardHexes = Hex.hexDisk({ q: 0, r: 0 }, arr.radius);
  var occupied = occupiedHexMap(placements);

  var pts = boardHexes.map(function(h) { return { hex: h, px: Hex.axialToPixel(h, HEX_PIXEL_SIZE) }; });
  var xs = pts.map(function(p) { return p.px.x; });
  var ys = pts.map(function(p) { return p.px.y; });
  var pad = HEX_PIXEL_SIZE + 8;
  var minX = Math.min.apply(null, xs) - pad, maxX = Math.max.apply(null, xs) + pad;
  var minY = Math.min.apply(null, ys) - pad, maxY = Math.max.apply(null, ys) + pad;
  var width = maxX - minX, height = maxY - minY;

  var svg = svgEl('svg', { width: width, height: height, viewBox: '0 0 ' + width + ' ' + height });

  var defs = svgEl('defs', {});
  var arrowMarker = svgEl('marker', {
    id: 'reach-arrowhead', viewBox: '0 0 10 10', refX: '8', refY: '5',
    markerWidth: '6', markerHeight: '6', orient: 'auto-start-reverse',
  });
  arrowMarker.appendChild(svgEl('path', { d: 'M0,0 L10,5 L0,10 Z', class: 'hex-arrowhead' }));
  defs.appendChild(arrowMarker);
  // Anti-effector reaches get their own marker so effector (activates) and
  // anti-effector (deactivates) reach lines are visually distinguishable on
  // the board without relying on a tooltip.
  var antiArrowMarker = svgEl('marker', {
    id: 'reach-arrowhead-anti', viewBox: '0 0 10 10', refX: '8', refY: '5',
    markerWidth: '6', markerHeight: '6', orient: 'auto-start-reverse',
  });
  antiArrowMarker.appendChild(svgEl('path', { d: 'M0,0 L10,5 L0,10 Z', class: 'hex-arrowhead anti' }));
  defs.appendChild(antiArrowMarker);
  svg.appendChild(defs);

  pts.forEach(function(p) {
    var cx = p.px.x - minX, cy = p.px.y - minY;
    var entry = occupied[Hex.keyOf(p.hex)];
    var isAnchor = entry && entry.anchor.q === p.hex.q && entry.anchor.r === p.hex.r;
    var poly = svgEl('polygon', {
      points: Hex.hexCornersSvgPoints(cx, cy, HEX_PIXEL_SIZE - 1.5),
      class: 'hex-cell' + (entry ? ' occupied' : ''),
      'data-q': p.hex.q,
      'data-r': p.hex.r,
    });
    if (entry) {
      var rune = getRune(entry.ritual.primary);
      // Inline style, not setAttribute('fill', …) — the .hex-cell class's
      // CSS `fill` would otherwise win over a presentation attribute.
      poly.style.fill = rune ? rune.color : '#999';
      poly.style.fillOpacity = isAnchor ? '0.85' : '0.35';
      var title = svgEl('title', {});
      title.textContent = entry.ritual.name + (isAnchor ? ' (size ' + entry.size + ')' : '');
      poly.appendChild(title);
    } else {
      poly.onclick = function() { openRitualPicker(arr, p.hex); };
    }
    svg.appendChild(poly);
  });

  // Reaches are directional (drawn with an arrowhead pointing at the
  // target). When a pair reaches each other both ways, the two arrows are
  // offset to either side of the centerline instead of drawn on top of each
  // other — otherwise they'd fully overlap and hide each other's order
  // badge, which is why badges used to appear to "skip" numbers. Computed
  // once by the caller and shared with the resolution log so the two never
  // disagree.
  var reachKeys = {};
  reaches.forEach(function(reach) {
    reachKeys[reach.from.placement.id + '>' + reach.to.placement.id] = true;
  });

  reaches.forEach(function(reach) {
    var fromPx = Hex.axialToPixel(reach.from.anchor, HEX_PIXEL_SIZE);
    var toPx = Hex.axialToPixel(reach.to.anchor, HEX_PIXEL_SIZE);
    var x1 = fromPx.x - minX, y1 = fromPx.y - minY, x2 = toPx.x - minX, y2 = toPx.y - minY;

    var isMutual = !!reachKeys[reach.to.placement.id + '>' + reach.from.placement.id];
    var seg = isMutual ? Hex.offsetSegment(x1, y1, x2, y2, REACH_OFFSET_PX) : { x1: x1, y1: y1, x2: x2, y2: y2 };
    seg = Hex.shortenSegment(seg.x1, seg.y1, seg.x2, seg.y2, REACH_START_PAD, REACH_END_PAD);
    reach.line = seg;

    var isAnti = reach.kind === 'anti-effector';
    var line = svgEl('line', {
      x1: seg.x1, y1: seg.y1, x2: seg.x2, y2: seg.y2,
      class: 'hex-reach-line' + (isAnti ? ' anti' : ''),
      'marker-end': isAnti ? 'url(#reach-arrowhead-anti)' : 'url(#reach-arrowhead)',
    });
    svg.appendChild(line);
  });
  reaches.forEach(function(reach) {
    var mx = (reach.line.x1 + reach.line.x2) / 2, my = (reach.line.y1 + reach.line.y2) / 2;
    var verb = reach.kind === 'anti-effector' ? 'Deactivates' : 'Activates';
    var g = svgEl('g', { class: 'hex-order-badge' + (reach.kind === 'anti-effector' ? ' anti' : '') });
    g.appendChild(svgEl('circle', { cx: mx, cy: my, r: 7.5 }));
    var text = svgEl('text', { x: mx, y: my });
    text.textContent = reach.order;
    g.appendChild(text);
    var title = svgEl('title', {});
    title.textContent = reach.order + '. ' + reach.from.ritual.name + ' ' + verb + ' ' + reach.to.ritual.name + ' (distance ' + reach.distance + ')';
    g.appendChild(title);
    svg.appendChild(g);
  });

  // Zoom is applied as a CSS transform on the (unscaled) svg, wrapped in a
  // container sized to the scaled dimensions so .hex-board-wrap's scrollbars
  // reflect the zoomed-in size. Kept as stable ids (only one board is ever
  // on screen at a time) so changing zoom can restyle these two elements
  // directly instead of rebuilding the whole board — see applyZoom().
  var container = document.createElement('div');
  container.id = 'hex-board-container';
  container.style.cssText = 'position:relative;width:' + (width * zoom) + 'px;height:' + (height * zoom) + 'px;';
  svg.id = 'hex-board-svg';
  svg.style.cssText = 'position:absolute;top:0;left:0;transform-origin:0 0;transform:scale(' + zoom + ');';
  container.appendChild(svg);
  return container;
}

// A plain-text readout of the same reach order the board's numbered badges
// show — badges are easy to lose track of on a dense or zoomed-out board,
// so this is a readable fallback for "what order does this resolve in".
function renderResolutionLog(reaches) {
  var wrap = document.createElement('div');
  wrap.style.cssText = 'border:0.5px solid var(--border);border-radius:var(--radius);background:var(--bg2);flex-shrink:0;';

  var header = document.createElement('div');
  header.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:6px 10px;cursor:pointer;user-select:none;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.03em;';
  var title = document.createElement('span');
  title.textContent = 'Resolution order (' + reaches.length + ')';
  var arrow = document.createElement('span');
  arrow.textContent = resolutionLogOpen ? '▾' : '▸';
  header.appendChild(title);
  header.appendChild(arrow);
  header.onclick = function() {
    resolutionLogOpen = !resolutionLogOpen;
    renderArrayEditor(getArray(currentArrayId));
  };
  wrap.appendChild(header);

  if (resolutionLogOpen) {
    var body = document.createElement('div');
    body.style.cssText = 'max-height:130px;overflow-y:auto;padding:0 10px 8px;';
    if (reaches.length === 0) {
      var empty = document.createElement('div');
      empty.style.cssText = 'font-size:11px;color:var(--text3);padding:2px 0 6px;';
      empty.textContent = 'No reach lines yet — mark a placement as an Effector or Anti-effector to see resolution order here.';
      body.appendChild(empty);
    } else {
      var ol = document.createElement('ol');
      ol.style.cssText = 'padding-left:18px;font-size:12px;line-height:1.7;';
      reaches.forEach(function(reach) {
        var li = document.createElement('li');
        var verb = reach.kind === 'anti-effector' ? 'Deactivates' : 'Activates';
        li.textContent = reach.from.ritual.name + ' ' + verb + ' ' + reach.to.ritual.name + ' (distance ' + reach.distance + ')';
        ol.appendChild(li);
      });
      body.appendChild(ol);
    }
    wrap.appendChild(body);
  }
  return wrap;
}

// Which triggerable placements have their Simulations entry expanded —
// keyed by placement id, reset whenever a different array is opened (see
// openArray). A person could trigger any triggerable ritual in the array, so
// there's one simulation per triggerable placement rather than a single
// array-wide one.
var simulationOpenIds = {};

// One collapsible entry per triggerable placement, each running
// Simulation.simulate() (public/simulation.js) starting from that placement
// and showing the pass-by-pass effect log plus the final active/inactive
// state of every placement in the array — "what happens if a person
// triggers this ritual". Reaches are the same ones the board/resolution log
// already computed, so the simulation never disagrees with what's drawn.
function renderSimulations(arr, placements, reaches) {
  var wrap = document.createElement('div');
  wrap.className = 'simulation-panel';

  var header = document.createElement('div');
  header.style.cssText = 'padding:6px 10px;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.03em;';
  var triggerables = placements.filter(function(entry) { return entry.ritual.triggerable !== false; });
  header.textContent = 'Simulations (' + triggerables.length + ')';
  wrap.appendChild(header);

  if (triggerables.length === 0) {
    var empty = document.createElement('div');
    empty.className = 'simulation-empty';
    empty.textContent = 'No triggerable rituals in this array yet — mark a ritual as triggerable, or place one, to see a simulation.';
    wrap.appendChild(empty);
    return wrap;
  }

  triggerables.forEach(function(entry) {
    var placementId = entry.placement.id;
    var isOpen = !!simulationOpenIds[placementId];

    var entryEl = document.createElement('div');
    entryEl.className = 'simulation-entry';

    var entryHeader = document.createElement('div');
    entryHeader.className = 'simulation-entry-header';
    var name = document.createElement('span');
    name.textContent = entry.ritual.name;
    var arrow = document.createElement('span');
    arrow.textContent = isOpen ? '▾' : '▸';
    entryHeader.appendChild(name);
    entryHeader.appendChild(arrow);
    entryHeader.onclick = function() {
      simulationOpenIds[placementId] = !isOpen;
      renderArrayEditor(arr);
    };
    entryEl.appendChild(entryHeader);

    if (isOpen) {
      var body = document.createElement('div');
      body.className = 'simulation-entry-body';
      var result = Simulation.simulate(placements, reaches, placementId);

      if (!result.stabilized) {
        var warning = document.createElement('div');
        warning.className = 'simulation-warning';
        warning.textContent = 'Effects kept changing and didn’t settle after ' + result.passes.length + ' passes — showing the state so far.';
        body.appendChild(warning);
      }

      if (result.passes.length === 0) {
        var noEffects = document.createElement('div');
        noEffects.style.cssText = 'color:var(--text3);margin-bottom:6px;';
        noEffects.textContent = 'Triggering ' + entry.ritual.name + ' has no further effect on anything else in the array.';
        body.appendChild(noEffects);
      } else {
        result.passes.forEach(function(pass) {
          var passLabel = document.createElement('div');
          passLabel.style.cssText = 'font-weight:500;margin-top:4px;';
          passLabel.textContent = 'Pass ' + pass.pass;
          body.appendChild(passLabel);
          var passList = document.createElement('ul');
          passList.style.cssText = 'padding-left:16px;line-height:1.6;margin:0 0 4px;';
          pass.effects.forEach(function(effect) {
            var li = document.createElement('li');
            var verb = effect.kind === 'anti-effector' ? 'deactivates' : 'activates';
            li.textContent = effect.from.ritual.name + ' ' + verb + ' ' + effect.to.ritual.name;
            passList.appendChild(li);
          });
          body.appendChild(passList);
        });
      }

      var rosterLabel = document.createElement('div');
      rosterLabel.style.cssText = 'font-weight:500;margin-top:6px;';
      rosterLabel.textContent = 'Final state';
      body.appendChild(rosterLabel);
      placements.forEach(function(rosterEntry) {
        var isActive = !!result.active[rosterEntry.placement.id];
        var row = document.createElement('div');
        row.className = 'simulation-roster-item';
        var dot = document.createElement('span');
        dot.className = 'simulation-roster-dot ' + (isActive ? 'active' : 'inactive');
        var label = document.createElement('span');
        label.textContent = rosterEntry.ritual.name + ' — ' + (isActive ? 'Active' : 'Inactive');
        row.appendChild(dot); row.appendChild(label);
        body.appendChild(row);
      });

      entryEl.appendChild(body);
    }

    wrap.appendChild(entryEl);
  });

  return wrap;
}

// Rasterizes the board (at its base 1x size, ignoring the current on-screen
// zoom) to a downloadable PNG. Entirely client-side: the board is already
// an SVG, so this clones it, inlines the handful of theme colors it needs
// (a standalone SVG document can't see shared.css), and draws it to a
// canvas at 2x for a crisper export.
function exportBoardAsPng(arr) {
  var svg = document.getElementById('hex-board-svg');
  if (!svg) return;
  var width = parseFloat(svg.getAttribute('width'));
  var height = parseFloat(svg.getAttribute('height'));

  var clone = svg.cloneNode(true);
  clone.removeAttribute('style');

  var cs = getComputedStyle(document.documentElement);
  var styleEl = document.createElementNS('http://www.w3.org/2000/svg', 'style');
  styleEl.textContent =
    '.hex-cell { fill: ' + cs.getPropertyValue('--bg') + '; stroke: ' + cs.getPropertyValue('--border2') + '; stroke-width: 1; }' +
    '.hex-reach-line { stroke: ' + cs.getPropertyValue('--accent') + '; stroke-width: 1.5; opacity: 0.55; }' +
    '.hex-reach-line.anti { stroke: #dc2626; stroke-dasharray: 4 3; }' +
    '.hex-arrowhead { fill: ' + cs.getPropertyValue('--accent') + '; opacity: 0.55; }' +
    '.hex-arrowhead.anti { fill: #dc2626; }' +
    '.hex-order-badge circle { fill: ' + cs.getPropertyValue('--accent') + '; stroke: ' + cs.getPropertyValue('--bg2') + '; stroke-width: 1.5; }' +
    '.hex-order-badge.anti circle { fill: #dc2626; }' +
    '.hex-order-badge text { fill: #fff; font-size: 9px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }' +
    'text { font-family: system-ui, -apple-system, sans-serif; }';
  clone.insertBefore(styleEl, clone.firstChild);

  var bgRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  bgRect.setAttribute('width', '100%');
  bgRect.setAttribute('height', '100%');
  bgRect.setAttribute('fill', cs.getPropertyValue('--bg2'));
  clone.insertBefore(bgRect, styleEl.nextSibling);

  var xml = new XMLSerializer().serializeToString(clone);
  var svgUrl = URL.createObjectURL(new Blob([xml], { type: 'image/svg+xml;charset=utf-8' }));

  var img = new Image();
  img.onload = function() {
    var scale = 2;
    var canvas = document.createElement('canvas');
    canvas.width = width * scale;
    canvas.height = height * scale;
    var ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(svgUrl);
    canvas.toBlob(function(blob) {
      var link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = (arr.name || 'array').replace(/[^a-z0-9-_]+/gi, '_') + '.png';
      link.click();
      URL.revokeObjectURL(link.href);
    }, 'image/png');
  };
  img.src = svgUrl;
}

// Restyles the already-rendered board in place for a new zoom level,
// instead of rebuilding its hexes/lines/badges from scratch — keeps
// scroll-wheel zooming smooth, and preserves scroll position (the caller
// adjusts it separately to keep the pointer anchored).
function applyZoom(zoom) {
  var container = document.getElementById('hex-board-container');
  var svg = document.getElementById('hex-board-svg');
  if (!container || !svg) return;
  var baseWidth = parseFloat(svg.getAttribute('width'));
  var baseHeight = parseFloat(svg.getAttribute('height'));
  container.style.width = (baseWidth * zoom) + 'px';
  container.style.height = (baseHeight * zoom) + 'px';
  svg.style.transform = 'scale(' + zoom + ')';
  var zoomVal = document.getElementById('zoom-val');
  if (zoomVal) zoomVal.textContent = Math.round(zoom * 100) + '%';
}

function changeRadius(arr, delta) {
  var n = Math.max(1, Math.min(Hex.MAX_BOARD_RADIUS, arr.radius + delta));
  if (n === arr.radius) return;
  arr.radius = n;
  // Dropping the board smaller can strand placements whose footprint no
  // longer fits — same "clear what no longer fits" behavior the old
  // rows/cols spinners had.
  if (delta < 0) {
    arr.placements = arr.placements.filter(function(p) {
      return Hex.footprintHexes({ q: p.q, r: p.r }, p.size || 1).every(function(hex) {
        return Hex.hexDistance({ q: 0, r: 0 }, hex) <= arr.radius;
      });
    });
  }
  renderArrayEditor(arr);
  renderArrayList();
  saveArray(arr);
}

// Zoom is a view preference, not part of the array's saved data — it isn't
// persisted, and resets to 100% whenever a different array is opened.
// Restyles the existing board in place (applyZoom) rather than re-rendering
// the whole editor, so it stays smooth under a rapid stream of wheel events.
function setZoom(next) {
  var n = Math.round(Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, next)) * 100) / 100;
  if (n === zoomLevel) return;
  zoomLevel = n;
  applyZoom(zoomLevel);
}

// Trackpad pinch-to-zoom is delivered by the browser as a wheel event with
// ctrlKey set (true for an actual pinch gesture, and conveniently also true
// for a physical Ctrl/Cmd+scroll — which doubles as the mouse-friendly
// equivalent) — plain two-finger scrolling has ctrlKey false and keeps
// panning the board normally.
function attachZoomScroll(boardWrap) {
  boardWrap.addEventListener('wheel', function(e) {
    if (!e.ctrlKey) return;
    e.preventDefault();

    var rect = boardWrap.getBoundingClientRect();
    var offsetX = e.clientX - rect.left, offsetY = e.clientY - rect.top;
    // The board point currently under the pointer, so it can be kept there
    // after the zoom changes instead of the view jumping around it.
    var boardX = (boardWrap.scrollLeft + offsetX) / zoomLevel;
    var boardY = (boardWrap.scrollTop + offsetY) / zoomLevel;

    setZoom(zoomLevel * Math.exp(-e.deltaY / 300));

    boardWrap.scrollLeft = boardX * zoomLevel - offsetX;
    boardWrap.scrollTop = boardY * zoomLevel - offsetY;
  }, { passive: false });
}

// Grows or shrinks one placement's size in place. Growing is validated the
// same way an initial placement is (must stay on the board, must not
// overlap another placement's footprint); shrinking is always safe.
function resizePlacement(arr, placementId, delta) {
  var p = arr.placements.find(function(x) { return x.id === placementId; });
  if (!p) return;
  var current = p.size || 1;
  var next = Math.max(1, Math.min(Hex.MAX_PLACEMENT_SIZE, current + delta));
  if (next === current) return;

  if (delta > 0) {
    var footprint = Hex.footprintHexes({ q: p.q, r: p.r }, next);
    var withinBoard = footprint.every(function(h) { return Hex.hexDistance({ q: 0, r: 0 }, h) <= arr.radius; });
    var others = livePlacements(arr).filter(function(entry) { return entry.placement.id !== placementId; });
    var occupied = occupiedHexMap(others);
    var overlaps = footprint.some(function(h) { return !!occupied[Hex.keyOf(h)]; });
    if (!withinBoard) { alert('Growing to size ' + next + ' would overflow the board.'); return; }
    if (overlaps) { alert('Growing to size ' + next + ' would overlap another ritual placed here.'); return; }
  }

  p.size = next;
  renderArrayEditor(arr);
  renderArrayList();
  saveArray(arr);
}

// Highlights, directly on the already-rendered board, where a candidate
// placement would sit (solid fill) and how far it would reach if later
// marked an Effector (dashed ring) — live while the size picker is open,
// so sizing a placement doesn't require placing it first to see its reach.
function showRangePreview(hex, size) {
  clearRangePreview();
  var footprint = Hex.footprintHexes(hex, size);
  var footprintKeys = {};
  footprint.forEach(function(h) { footprintKeys[Hex.keyOf(h)] = true; });
  Hex.hexDisk(hex, Hex.rangeForSize(size)).forEach(function(h) {
    var el = document.querySelector('.hex-cell[data-q="' + h.q + '"][data-r="' + h.r + '"]');
    if (!el) return;
    el.classList.add(footprintKeys[Hex.keyOf(h)] ? 'preview-footprint' : 'preview-range');
  });
}

function clearRangePreview() {
  document.querySelectorAll('.preview-footprint, .preview-range').forEach(function(el) {
    el.classList.remove('preview-footprint', 'preview-range');
  });
}

    });
  }

  searchInput.oninput = function() { renderPickerList(searchInput.value.toLowerCase()); };
  renderPickerList('');

  var cancelWrap = document.createElement('div');
  cancelWrap.className = 'array-picker-cancel';
  var cancelBtn = document.createElement('button');
  cancelBtn.textContent = 'Cancel';
  cancelBtn.onclick = closePicker;
  cancelWrap.appendChild(cancelBtn);

  picker.appendChild(sizeRow);
  picker.appendChild(searchWrap);
  picker.appendChild(list);
  picker.appendChild(errorEl);
  picker.appendChild(cancelWrap);

  document.body.appendChild(picker);

  // Position near centre of screen
  picker.style.top = '50%';
  picker.style.left = '50%';
  picker.style.transform = 'translate(-50%, -50%)';

  setTimeout(function() { searchInput.focus(); }, 50);

  // Close on outside click
  setTimeout(function() {
    document.addEventListener('click', outsidePickerClick);
  }, 10);
}

// Places `ritual` anchored at `hex` at the chosen `size` (a property of
// this placement, not the ritual — the same ritual can be placed at
// different sizes), if its footprint fits the board and doesn't overlap
// anything already placed there. Shows an inline error in the picker
// instead of closing it if it doesn't fit.
function attemptPlacement(arr, hex, ritual, size) {
  var footprint = Hex.footprintHexes(hex, size);
  var withinBoard = footprint.every(function(h) { return Hex.hexDistance({ q: 0, r: 0 }, h) <= arr.radius; });
  var occupied = occupiedHexMap(livePlacements(arr));
  var overlaps = footprint.some(function(h) { return !!occupied[Hex.keyOf(h)]; });

  var errorEl = document.querySelector('#ritual-picker .array-picker-error');
  if (!withinBoard) {
    if (errorEl) errorEl.textContent = '"' + ritual.name + '" (size ' + size + ') doesn’t fit within the board here — try a more central hex, a smaller size, or a larger board.';
    return;
  }
  if (overlaps) {
    if (errorEl) errorEl.textContent = '"' + ritual.name + '" (size ' + size + ') would overlap a ritual already placed here.';
    return;
  }

  arr.placements.push({ id: crypto.randomUUID(), ritualId: ritual.id, q: hex.q, r: hex.r, size: size, isEffector: false, isAntiEffector: false });
  closePicker();
  renderArrayEditor(arr);
  renderArrayList();
  saveArray(arr);
}

function outsidePickerClick(e) {
  var picker = document.getElementById('ritual-picker');
  if (picker && !picker.contains(e.target)) { closePicker(); }
}

function closePicker() {
  var picker = document.getElementById('ritual-picker');
  if (picker) picker.parentNode.removeChild(picker);
  clearRangePreview();
  document.removeEventListener('click', outsidePickerClick);
}

// ── Init ─────────────────────────────────────────────────────────────────────

async function init() {
  await Promise.all([loadLibrary(), loadArrays()]);
  renderArrayList();
  // Lets a ritual's "used in arrays" backlink (index.html) jump straight
  // to the array in question.
  var openId = new URLSearchParams(window.location.search).get('open');
  if (openId && getArray(openId)) openArray(openId);
}
init();
</script>
