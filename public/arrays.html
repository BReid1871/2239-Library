<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arrays — Ritual Library</title>
<script src="theme-init.js"></script>
<link rel="stylesheet" href="shared.css">
<style>
.array-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 8px 10px; margin-bottom: 6px; cursor: pointer; transition: all 0.1s; }
.array-card:hover { border-color: var(--accent); }
.array-card.selected { border-color: var(--accent); background: var(--bg); }
.array-card-title { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.array-card-meta { font-size: 10px; color: var(--text3); margin-top: 1px; }
.hex-board-wrap { flex: 1; overflow: auto; border: 0.5px solid var(--border2); border-radius: var(--radius); background: var(--bg2); position: relative; min-width: 0; }
.hex-cell { fill: var(--bg); stroke: var(--border2); stroke-width: 1; cursor: pointer; transition: fill 0.1s, stroke 0.1s; }
.hex-cell:hover { stroke: var(--accent); }
.hex-cell.occupied { cursor: default; }
.hex-reach-line { stroke: var(--accent); stroke-width: 1.5; opacity: 0.45; pointer-events: none; }
.hex-order-badge circle { fill: var(--accent); stroke: var(--bg2); stroke-width: 1.5; }
.hex-order-badge text { fill: #fff; font-size: 9px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
.placement-list { width: 210px; flex-shrink: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.placement-item { display: flex; align-items: flex-start; gap: 6px; padding: 7px 9px; border-radius: var(--radius); background: var(--bg2); border: 0.5px solid var(--border); }
.placement-item-body { flex: 1; min-width: 0; }
.placement-item-name { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.placement-item-meta { font-size: 10px; color: var(--text3); margin-top: 1px; }
.placement-item-size { display: flex; align-items: center; gap: 5px; margin-top: 5px; }
.placement-item-size button { padding: 1px 6px; font-size: 11px; }
.placement-item-size span { font-size: 11px; color: var(--text2); min-width: 44px; }
.picker-size-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 0.5px solid var(--border); font-size: 11px; color: var(--text3); }
.picker-size-row button { padding: 1px 7px; font-size: 12px; }
.picker-size-row span { font-size: 12px; color: var(--text); min-width: 14px; text-align: center; }
.placement-item-actions { display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; }
.placement-item-actions button { font-size: 10px; padding: 1px 7px; }
.placement-empty { font-size: 11px; color: var(--text3); text-align: center; padding: 1rem 0.5rem; }
.array-picker { position: fixed; background: var(--bg); border: 0.5px solid var(--border2); border-radius: var(--radius-lg); box-shadow: 0 8px 24px rgba(0,0,0,0.18); z-index: 999; width: 240px; max-height: 380px; display: flex; flex-direction: column; }
.array-picker-search { padding: 8px 10px; border-bottom: 0.5px solid var(--border); }
.array-picker-search input { width: 100%; padding: 5px 8px; font-size: 12px; border: 0.5px solid var(--border2); border-radius: 5px; background: var(--bg2); color: var(--text); outline: none; }
.array-picker-list { flex: 1; overflow-y: auto; padding: 6px; }
.array-picker-item { padding: 6px 8px; border-radius: 5px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 6px; }
.array-picker-item:hover { background: var(--bg2); }
.array-picker-item-name { flex: 1; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.array-picker-item-meta { font-size: 10px; color: var(--text3); }
.array-picker-empty { font-size: 12px; color: var(--text3); text-align: center; padding: 1rem; }
.array-picker-error { font-size: 11px; color: #dc2626; text-align: center; padding: 0 10px 8px; }
.array-picker-cancel { padding: 6px; border-top: 0.5px solid var(--border); text-align: center; }
.array-picker-cancel button { font-size: 11px; }
.array-grid-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.array-name-input { font-size: 15px; font-weight: 500; border: none; border-bottom: 0.5px solid var(--border); padding: 2px 0; background: transparent; color: var(--text); outline: none; flex: 1; }
.array-name-input:focus { border-bottom-color: var(--accent); }
#ritual-preview-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 1000; }
#ritual-preview-overlay .card { max-width: 420px; width: 90vw; background: var(--bg); }
</style>
</head>
<body>
<div class="page-wrap">
  <div class="tabs" id="nav"></div>

  <div style="display:flex;align-items:flex-start;gap:1.5rem;height:calc(100vh - 160px);">

    <!-- Left: array list + controls -->
    <div style="width:200px;flex-shrink:0;display:flex;flex-direction:column;gap:10px;height:100%;overflow:hidden;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <span style="font-size:13px;font-weight:500;">Arrays</span>
        <button class="primary" onclick="newArray()" style="font-size:11px;padding:3px 10px;">+ New</button>
      </div>
      <div id="array-list" style="flex:1;overflow-y:auto;"></div>
    </div>

    <!-- Right: array editor -->
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;height:100%;" id="array-editor-area">
      <div class="notes-empty">Select an array or create a new one.</div>
    </div>

  </div>
</div>

<script src="reference-data.js"></script>
<script src="hex.js"></script>
<script src="shared.js"></script>
<script>
renderNav('nav', 'arrays', [], function() {});

// ── Data ─────────────────────────────────────────────────────────────────────

var library = [];
var arrays = [];
async function loadLibrary() { library = await api('GET', '/api/rituals'); }
async function loadArrays() { arrays = await api('GET', '/api/arrays'); }

function getRitualById(id) {
  for (var i = 0; i < library.length; i++) { if (library[i].id === id) return library[i]; }
  return null;
}

// ── Ritual preview (read-only — full detail/edit lives on the Add Ritual page) ─

function openRitualPreview(id) {
  var r = getRitualById(id);
  if (!r) return;
  closeRitualPreview();

  var pr = getRune(r.primary);
  var ignored = IGNORES[r.primary] || [];
  var subs = r.subs || [];
  var activeSubs = subs.filter(function(s) { return ignored.indexOf(s) < 0; });
  var tc = TIER_COLORS[r.tier] || '#999';

  var chipHTML = '';
  if (pr) chipHTML += '<span class="rune-chip"><span class="dot" style="background:' + pr.color + '"></span>' + esc(r.primary) + '</span>';
  activeSubs.forEach(function(s) {
    var sr = getRune(s);
    chipHTML += '<span class="rune-chip" style="color:var(--text3)">+ <span class="dot" style="background:' + (sr ? sr.color : '#ccc') + '"></span>' + esc(s) + '</span>';
  });

  var html = '<div class="card">';
  html += '<div class="detail-top">';
  html += '<div><div class="ritual-name">' + esc(r.name) + '</div>';
  html += '<div>';
  html += '<span class="badge" style="background:' + tc + '22;color:' + tc + ';border:0.5px solid ' + tc + '44">' + r.tier + '</span>';
  html += '<span class="badge" style="background:var(--bg2);color:var(--text2);border:0.5px solid var(--border)">' + esc(r.purpose) + '</span>';
  html += '</div></div>';
  html += '<button id="ritual-preview-close">Close</button>';
  html += '</div>';
  html += '<div class="rune-row">' + chipHTML + '</div>';
  html += '<hr class="hdivider">';
  html += '<div class="fl">Effect</div><div class="fv">' + esc(r.effect || '') + '</div>';
  var d = new Date(r.createdAt);
  html += '<div style="margin-top:0.5rem;font-size:11px;color:var(--text3)">Added ' + d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}) + ' · ' + subs.length + ' subsidiary rune' + (subs.length !== 1 ? 's' : '') + '</div>';
  html += '</div>';

  var overlay = document.createElement('div');
  overlay.id = 'ritual-preview-overlay';
  overlay.innerHTML = html;
  overlay.onclick = function(e) { if (e.target === overlay) closeRitualPreview(); };
  document.body.appendChild(overlay);
  document.getElementById('ritual-preview-close').onclick = closeRitualPreview;
}

function closeRitualPreview() {
  var overlay = document.getElementById('ritual-preview-overlay');
  if (overlay) overlay.parentNode.removeChild(overlay);
}

// ── Arrays ───────────────────────────────────────────────────────────────────

var currentArrayId = null;
var HEX_PIXEL_SIZE = 26;

function getArray(id) {
  for (var i = 0; i < arrays.length; i++) { if (arrays[i].id === id) return arrays[i]; }
  return null;
}

function saveArray(arr) {
  api('PUT', '/api/arrays/' + arr.id, { name: arr.name, radius: arr.radius, placements: arr.placements })
    .catch(function(e) { console.error('Failed to save array', e); });
}

var saveArrayDebounced = debounce(saveArray, 400);

async function newArray() {
  var created = await api('POST', '/api/arrays', { name: 'Untitled Array', radius: 3, placements: [] });
  await loadArrays();
  renderArrayList();
  openArray(created.id);
}

async function deleteArray(id) {
  var arr = getArray(id);
  if (!arr || !confirm('Delete array "' + arr.name + '"?')) return;
  await api('DELETE', '/api/arrays/' + id);
  await loadArrays();
  if (currentArrayId === id) {
    currentArrayId = null;
    document.getElementById('array-editor-area').innerHTML = '<div class="notes-empty">Select an array or create a new one.</div>';
  }
  renderArrayList();
}

function renderArrayList() {
  var el = document.getElementById('array-list');
  if (!el) return;
  el.innerHTML = '';
  if (arrays.length === 0) {
    el.innerHTML = '<div style="font-size:12px;color:var(--text3);text-align:center;padding:1rem 0;">No arrays yet.</div>';
    return;
  }
  arrays.forEach(function(arr) {
    var card = document.createElement('div');
    card.className = 'array-card' + (arr.id === currentArrayId ? ' selected' : '');
    var title = document.createElement('div'); title.className = 'array-card-title'; title.textContent = arr.name;
    var count = (arr.placements || []).length;
    var meta = document.createElement('div'); meta.className = 'array-card-meta';
    meta.textContent = 'Radius ' + arr.radius + ' · ' + count + ' ritual' + (count !== 1 ? 's' : '');
    card.appendChild(title); card.appendChild(meta);
    card.onclick = function() { openArray(arr.id); };
    el.appendChild(card);
  });
}

function openArray(id) {
  var arr = getArray(id);
  if (!arr) return;
  currentArrayId = id;
  renderArrayList();
  renderArrayEditor(arr);
}

// ── Hex board helpers ────────────────────────────────────────────────────────

// Placements whose ritual still exists, each with its footprint hexes and
// range — a ritual can be deleted from the library after being placed, and
// (matching how deleted rituals were already handled before this feature)
// a placement pointing at a missing ritual is simply skipped everywhere.
// Size lives on the placement, not the ritual — the same ritual can be
// placed at different sizes.
function livePlacements(arr) {
  var out = [];
  (arr.placements || []).forEach(function(p) {
    var ritual = getRitualById(p.ritualId);
    if (!ritual) return;
    var size = p.size || 1;
    out.push({
      placement: p,
      ritual: ritual,
      size: size,
      anchor: { q: p.q, r: p.r },
      footprint: Hex.footprintHexes({ q: p.q, r: p.r }, size),
      range: Hex.rangeForSize(size),
    });
  });
  return out;
}

function occupiedHexMap(placements) {
  var map = {};
  placements.forEach(function(entry) {
    entry.footprint.forEach(function(hex) {
      map[Hex.keyOf(hex)] = entry;
    });
  });
  return map;
}

// Every directed "reach": ritual A's effect touches ritual B's anchor
// within A's range. Sorted closest-first — that ranking IS the order
// effects occur in, which is what the numbered overlay shows.
function computeReaches(placements) {
  var reaches = [];
  placements.forEach(function(a) {
    placements.forEach(function(b) {
      if (a === b) return;
      var dist = Hex.hexDistance(a.anchor, b.anchor);
      if (dist <= a.range) reaches.push({ from: a, to: b, distance: dist });
    });
  });
  reaches.sort(function(x, y) {
    if (x.distance !== y.distance) return x.distance - y.distance;
    var xk = x.from.placement.id + '>' + x.to.placement.id;
    var yk = y.from.placement.id + '>' + y.to.placement.id;
    return xk < yk ? -1 : xk > yk ? 1 : 0;
  });
  reaches.forEach(function(reach, i) { reach.order = i + 1; });
  return reaches;
}

function svgEl(tag, attrs) {
  var el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.keys(attrs || {}).forEach(function(k) { el.setAttribute(k, attrs[k]); });
  return el;
}

function renderHexBoard(arr, placements) {
  var boardHexes = Hex.hexDisk({ q: 0, r: 0 }, arr.radius);
  var occupied = occupiedHexMap(placements);

  var pts = boardHexes.map(function(h) { return { hex: h, px: Hex.axialToPixel(h, HEX_PIXEL_SIZE) }; });
  var xs = pts.map(function(p) { return p.px.x; });
  var ys = pts.map(function(p) { return p.px.y; });
  var pad = HEX_PIXEL_SIZE + 8;
  var minX = Math.min.apply(null, xs) - pad, maxX = Math.max.apply(null, xs) + pad;
  var minY = Math.min.apply(null, ys) - pad, maxY = Math.max.apply(null, ys) + pad;
  var width = maxX - minX, height = maxY - minY;

  var svg = svgEl('svg', { width: width, height: height, viewBox: '0 0 ' + width + ' ' + height });

  pts.forEach(function(p) {
    var cx = p.px.x - minX, cy = p.px.y - minY;
    var entry = occupied[Hex.keyOf(p.hex)];
    var isAnchor = entry && entry.anchor.q === p.hex.q && entry.anchor.r === p.hex.r;
    var poly = svgEl('polygon', {
      points: Hex.hexCornersSvgPoints(cx, cy, HEX_PIXEL_SIZE - 1.5),
      class: 'hex-cell' + (entry ? ' occupied' : ''),
      'data-q': p.hex.q,
      'data-r': p.hex.r,
    });
    if (entry) {
      var rune = getRune(entry.ritual.primary);
      // Inline style, not setAttribute('fill', …) — the .hex-cell class's
      // CSS `fill` would otherwise win over a presentation attribute.
      poly.style.fill = rune ? rune.color : '#999';
      poly.style.fillOpacity = isAnchor ? '0.85' : '0.35';
      var title = svgEl('title', {});
      title.textContent = entry.ritual.name + (isAnchor ? ' (size ' + entry.size + ')' : '');
      poly.appendChild(title);
    } else {
      poly.onclick = function() { openRitualPicker(arr, p.hex); };
    }
    svg.appendChild(poly);
  });

  var reaches = computeReaches(placements);
  reaches.forEach(function(reach) {
    var fromPx = Hex.axialToPixel(reach.from.anchor, HEX_PIXEL_SIZE);
    var toPx = Hex.axialToPixel(reach.to.anchor, HEX_PIXEL_SIZE);
    var x1 = fromPx.x - minX, y1 = fromPx.y - minY, x2 = toPx.x - minX, y2 = toPx.y - minY;
    var line = svgEl('line', { x1: x1, y1: y1, x2: x2, y2: y2, class: 'hex-reach-line' });
    svg.appendChild(line);
  });
  reaches.forEach(function(reach) {
    var fromPx = Hex.axialToPixel(reach.from.anchor, HEX_PIXEL_SIZE);
    var toPx = Hex.axialToPixel(reach.to.anchor, HEX_PIXEL_SIZE);
    var mx = (fromPx.x + toPx.x) / 2 - minX, my = (fromPx.y + toPx.y) / 2 - minY;
    var g = svgEl('g', { class: 'hex-order-badge' });
    g.appendChild(svgEl('circle', { cx: mx, cy: my, r: 7.5 }));
    var text = svgEl('text', { x: mx, y: my });
    text.textContent = reach.order;
    g.appendChild(text);
    var title = svgEl('title', {});
    title.textContent = reach.order + '. ' + reach.from.ritual.name + ' → ' + reach.to.ritual.name + ' (distance ' + reach.distance + ')';
    g.appendChild(title);
    svg.appendChild(g);
  });

  return svg;
}

function renderPlacementList(arr, placements) {
  var wrap = document.createElement('div');
  wrap.className = 'placement-list';
  if (placements.length === 0) {
    var empty = document.createElement('div');
    empty.className = 'placement-empty';
    empty.textContent = 'No rituals placed yet. Click a hex to add one.';
    wrap.appendChild(empty);
    return wrap;
  }
  placements.forEach(function(entry) {
    var item = document.createElement('div');
    item.className = 'placement-item';

    var body = document.createElement('div');
    body.className = 'placement-item-body';
    var name = document.createElement('div'); name.className = 'placement-item-name'; name.textContent = entry.ritual.name;
    var meta = document.createElement('div'); meta.className = 'placement-item-meta';
    meta.textContent = 'Range ' + entry.range;
    body.appendChild(name); body.appendChild(meta);

    var sizeRow = document.createElement('div');
    sizeRow.className = 'placement-item-size';
    var sizeDec = document.createElement('button'); sizeDec.textContent = '−';
    var sizeVal = document.createElement('span'); sizeVal.textContent = 'Size ' + entry.size;
    var sizeInc = document.createElement('button'); sizeInc.textContent = '+';
    sizeDec.onclick = function() { resizePlacement(arr, entry.placement.id, -1); };
    sizeInc.onclick = function() { resizePlacement(arr, entry.placement.id, 1); };
    sizeRow.appendChild(sizeDec); sizeRow.appendChild(sizeVal); sizeRow.appendChild(sizeInc);
    body.appendChild(sizeRow);

    var actions = document.createElement('div');
    actions.className = 'placement-item-actions';
    var viewBtn = document.createElement('button');
    viewBtn.textContent = 'View';
    viewBtn.onclick = function() { openRitualPreview(entry.ritual.id); };
    var removeBtn = document.createElement('button');
    removeBtn.className = 'danger';
    removeBtn.textContent = 'Remove';
    removeBtn.onclick = function() {
      arr.placements = arr.placements.filter(function(p) { return p.id !== entry.placement.id; });
      renderArrayEditor(arr);
      renderArrayList();
      saveArray(arr);
    };
    actions.appendChild(viewBtn); actions.appendChild(removeBtn);

    item.appendChild(body); item.appendChild(actions);
    wrap.appendChild(item);
  });
  return wrap;
}

function renderArrayEditor(arr) {
  var area = document.getElementById('array-editor-area');
  area.innerHTML = '';

  // Top bar: name + radius control
  var topBar = document.createElement('div');
  topBar.style.cssText = 'display:flex;align-items:center;gap:10px;flex-shrink:0;';

  var nameInput = document.createElement('input');
  nameInput.type = 'text';
  nameInput.className = 'array-name-input';
  nameInput.value = arr.name;
  nameInput.oninput = function() {
    arr.name = nameInput.value;
    renderArrayList();
    saveArrayDebounced(arr);
  };

  var radiusLabel = document.createElement('span');
  radiusLabel.style.cssText = 'font-size:11px;color:var(--text3);flex-shrink:0;';
  radiusLabel.textContent = 'Board radius:';

  var dec = document.createElement('button'); dec.textContent = '−'; dec.style.cssText = 'padding:2px 6px;font-size:12px;';
  var radiusVal = document.createElement('span'); radiusVal.style.cssText = 'font-size:12px;min-width:14px;text-align:center;'; radiusVal.textContent = arr.radius;
  var inc = document.createElement('button'); inc.textContent = '+'; inc.style.cssText = 'padding:2px 6px;font-size:12px;';
  dec.onclick = function() { changeRadius(arr, -1); };
  inc.onclick = function() { changeRadius(arr, 1); };

  var delBtn = document.createElement('button');
  delBtn.className = 'danger';
  delBtn.textContent = 'Delete';
  delBtn.style.cssText = 'font-size:11px;padding:3px 10px;flex-shrink:0;margin-left:auto;';
  delBtn.onclick = function() { deleteArray(arr.id); };

  topBar.appendChild(nameInput);
  topBar.appendChild(radiusLabel);
  topBar.appendChild(dec);
  topBar.appendChild(radiusVal);
  topBar.appendChild(inc);
  topBar.appendChild(delBtn);

  // Board + placement list, side by side. The numbered badges on the board
  // show the order in which ritual effects reach each other — closest
  // pairs (within the source ritual's range) resolve first.
  var row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:10px;flex:1;min-height:0;';

  var placements = livePlacements(arr);
  var boardWrap = document.createElement('div');
  boardWrap.className = 'hex-board-wrap';
  boardWrap.appendChild(renderHexBoard(arr, placements));

  row.appendChild(boardWrap);
  row.appendChild(renderPlacementList(arr, placements));

  area.appendChild(topBar);
  area.appendChild(row);
}

function changeRadius(arr, delta) {
  var n = Math.max(1, Math.min(Hex.MAX_BOARD_RADIUS, arr.radius + delta));
  if (n === arr.radius) return;
  arr.radius = n;
  // Dropping the board smaller can strand placements whose footprint no
  // longer fits — same "clear what no longer fits" behavior the old
  // rows/cols spinners had.
  if (delta < 0) {
    arr.placements = arr.placements.filter(function(p) {
      return Hex.footprintHexes({ q: p.q, r: p.r }, p.size || 1).every(function(hex) {
        return Hex.hexDistance({ q: 0, r: 0 }, hex) <= arr.radius;
      });
    });
  }
  renderArrayEditor(arr);
  renderArrayList();
  saveArray(arr);
}

// Grows or shrinks one placement's size in place. Growing is validated the
// same way an initial placement is (must stay on the board, must not
// overlap another placement's footprint); shrinking is always safe.
function resizePlacement(arr, placementId, delta) {
  var p = arr.placements.find(function(x) { return x.id === placementId; });
  if (!p) return;
  var current = p.size || 1;
  var next = Math.max(1, Math.min(Hex.MAX_PLACEMENT_SIZE, current + delta));
  if (next === current) return;

  if (delta > 0) {
    var footprint = Hex.footprintHexes({ q: p.q, r: p.r }, next);
    var withinBoard = footprint.every(function(h) { return Hex.hexDistance({ q: 0, r: 0 }, h) <= arr.radius; });
    var others = livePlacements(arr).filter(function(entry) { return entry.placement.id !== placementId; });
    var occupied = occupiedHexMap(others);
    var overlaps = footprint.some(function(h) { return !!occupied[Hex.keyOf(h)]; });
    if (!withinBoard) { alert('Growing to size ' + next + ' would overflow the board.'); return; }
    if (overlaps) { alert('Growing to size ' + next + ' would overlap another ritual placed here.'); return; }
  }

  p.size = next;
  renderArrayEditor(arr);
  renderArrayList();
  saveArray(arr);
}

function openRitualPicker(arr, hex) {
  closePicker();
  var picker = document.createElement('div');
  picker.className = 'array-picker';
  picker.id = 'ritual-picker';

  // Size is chosen here, per-placement, before picking a ritual — it's
  // not a property of the ritual itself.
  var pickerSize = 1;
  var sizeRow = document.createElement('div');
  sizeRow.className = 'picker-size-row';
  var sizeLabel = document.createElement('span'); sizeLabel.textContent = 'Size:';
  var sizeDec = document.createElement('button'); sizeDec.textContent = '−'; sizeDec.type = 'button';
  var sizeVal = document.createElement('span'); sizeVal.textContent = pickerSize;
  var sizeInc = document.createElement('button'); sizeInc.textContent = '+'; sizeInc.type = 'button';
  var rangeNote = document.createElement('span'); rangeNote.textContent = '(range ' + Hex.rangeForSize(pickerSize) + ')';
  sizeDec.onclick = function() {
    pickerSize = Math.max(1, pickerSize - 1);
    sizeVal.textContent = pickerSize;
    rangeNote.textContent = '(range ' + Hex.rangeForSize(pickerSize) + ')';
  };
  sizeInc.onclick = function() {
    pickerSize = Math.min(Hex.MAX_PLACEMENT_SIZE, pickerSize + 1);
    sizeVal.textContent = pickerSize;
    rangeNote.textContent = '(range ' + Hex.rangeForSize(pickerSize) + ')';
  };
  sizeRow.appendChild(sizeLabel); sizeRow.appendChild(sizeDec); sizeRow.appendChild(sizeVal); sizeRow.appendChild(sizeInc); sizeRow.appendChild(rangeNote);

  var searchWrap = document.createElement('div');
  searchWrap.className = 'array-picker-search';
  var searchInput = document.createElement('input');
  searchInput.placeholder = 'Search rituals…';
  searchInput.type = 'text';
  searchWrap.appendChild(searchInput);

  var list = document.createElement('div');
  list.className = 'array-picker-list';
  var errorEl = document.createElement('div');
  errorEl.className = 'array-picker-error';

  function renderPickerList(q) {
    list.innerHTML = '';
    var filtered = library.filter(function(r) {
      if (!q) return true;
      return r.name.toLowerCase().indexOf(q) >= 0 ||
             r.primary.toLowerCase().indexOf(q) >= 0 ||
             r.purpose.toLowerCase().indexOf(q) >= 0;
    });
    // Placing the same ritual more than once is allowed, so there's no
    // "already placed" filter here.
    if (filtered.length === 0) {
      list.innerHTML = '<div class="array-picker-empty">No rituals found.</div>';
      return;
    }
    filtered.forEach(function(r) {
      var item = document.createElement('div');
      item.className = 'array-picker-item';
      var pr = getRune(r.primary);
      var dot = document.createElement('span');
      dot.style.cssText = 'width:8px;height:8px;border-radius:50%;background:' + (pr?pr.color:'#ccc') + ';flex-shrink:0;border:0.5px solid rgba(128,128,128,0.2);';
      var nameEl = document.createElement('span'); nameEl.className = 'array-picker-item-name'; nameEl.textContent = r.name;
      var meta = document.createElement('span'); meta.className = 'array-picker-item-meta';
      var tc = TIER_COLORS[r.tier] || '#999';
      meta.innerHTML = '<span style="color:' + tc + ';font-weight:500">' + r.tier + '</span>';
      item.appendChild(dot); item.appendChild(nameEl); item.appendChild(meta);
      item.onclick = function() { attemptPlacement(arr, hex, r, pickerSize); };
      list.appendChild(item);
    });
  }

  searchInput.oninput = function() { renderPickerList(searchInput.value.toLowerCase()); };
  renderPickerList('');

  var cancelWrap = document.createElement('div');
  cancelWrap.className = 'array-picker-cancel';
  var cancelBtn = document.createElement('button');
  cancelBtn.textContent = 'Cancel';
  cancelBtn.onclick = closePicker;
  cancelWrap.appendChild(cancelBtn);

  picker.appendChild(sizeRow);
  picker.appendChild(searchWrap);
  picker.appendChild(list);
  picker.appendChild(errorEl);
  picker.appendChild(cancelWrap);

  document.body.appendChild(picker);

  // Position near centre of screen
  picker.style.top = '50%';
  picker.style.left = '50%';
  picker.style.transform = 'translate(-50%, -50%)';

  setTimeout(function() { searchInput.focus(); }, 50);

  // Close on outside click
  setTimeout(function() {
    document.addEventListener('click', outsidePickerClick);
  }, 10);
}

// Places `ritual` anchored at `hex` at the chosen `size` (a property of
// this placement, not the ritual — the same ritual can be placed at
// different sizes), if its footprint fits the board and doesn't overlap
// anything already placed there. Shows an inline error in the picker
// instead of closing it if it doesn't fit.
function attemptPlacement(arr, hex, ritual, size) {
  var footprint = Hex.footprintHexes(hex, size);
  var withinBoard = footprint.every(function(h) { return Hex.hexDistance({ q: 0, r: 0 }, h) <= arr.radius; });
  var occupied = occupiedHexMap(livePlacements(arr));
  var overlaps = footprint.some(function(h) { return !!occupied[Hex.keyOf(h)]; });

  var errorEl = document.querySelector('#ritual-picker .array-picker-error');
  if (!withinBoard) {
    if (errorEl) errorEl.textContent = '"' + ritual.name + '" (size ' + size + ') doesn’t fit within the board here — try a more central hex, a smaller size, or a larger board.';
    return;
  }
  if (overlaps) {
    if (errorEl) errorEl.textContent = '"' + ritual.name + '" (size ' + size + ') would overlap a ritual already placed here.';
    return;
  }

  arr.placements.push({ id: crypto.randomUUID(), ritualId: ritual.id, q: hex.q, r: hex.r, size: size });
  closePicker();
  renderArrayEditor(arr);
  renderArrayList();
  saveArray(arr);
}

function outsidePickerClick(e) {
  var picker = document.getElementById('ritual-picker');
  if (picker && !picker.contains(e.target)) { closePicker(); }
}

function closePicker() {
  var picker = document.getElementById('ritual-picker');
  if (picker) picker.parentNode.removeChild(picker);
  document.removeEventListener('click', outsidePickerClick);
}

// ── Init ─────────────────────────────────────────────────────────────────────

async function init() {
  await Promise.all([loadLibrary(), loadArrays()]);
  renderArrayList();
}
init();
</script>
