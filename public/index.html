<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ritual Library</title>
<script src="theme-init.js"></script>
<link rel="stylesheet" href="shared.css">
<style>
/* Three-column layout */
.app { display: flex; min-height: 100vh; }

/* Left: library */
.lib-panel { width: 220px; flex-shrink: 0; border-right: 0.5px solid var(--border); display: flex; flex-direction: column; height: 100vh; position: sticky; top: 0; overflow: hidden; }

/* Centre: main */
.main { flex: 1; min-width: 0; padding: 2rem 1.75rem 4rem; }

/* Right: reference */
.ref-panel { width: 260px; flex-shrink: 0; border-left: 0.5px solid var(--border); height: 100vh; position: sticky; top: 0; overflow: hidden; display: flex; flex-direction: column; }
.ref-header { padding: 1rem 1rem 0.6rem; border-bottom: 0.5px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.ref-header h3 { font-size: 13px; font-weight: 500; }
.ref-search { padding: 0.6rem 1rem; border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
.ref-search input { width: 100%; padding: 5px 9px; border: 0.5px solid var(--border2); border-radius: var(--radius); background: var(--bg2); color: var(--text); font-size: 12px; outline: none; }
.ref-search input:focus { border-color: var(--accent); background: var(--bg); }
.ref-rune-tabs { padding: 0.5rem 1rem; border-bottom: 0.5px solid var(--border); display: flex; flex-wrap: wrap; gap: 4px; flex-shrink: 0; }
.ref-tab { font-size: 10px; padding: 2px 7px; border-radius: 99px; cursor: pointer; border: 0.5px solid var(--border2); color: var(--text3); user-select: none; transition: all 0.1s; }
.ref-tab:hover { color: var(--text); border-color: var(--border2); }
.ref-tab.active { color: #fff; border-color: transparent; }
.ref-body { flex: 1; overflow-y: auto; padding: 0.75rem 1rem 1rem; }
.ref-rune-block { margin-bottom: 1.25rem; }
.ref-rune-name { font-size: 12px; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.ref-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; border: 0.5px solid rgba(128,128,128,0.2); }
.ref-tier { font-size: 10px; color: var(--text3); font-weight: 400; margin-bottom: 4px; margin-top: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
.ref-component { font-size: 12px; padding: 4px 7px; border-radius: 5px; background: var(--bg2); margin-bottom: 3px; cursor: default; }
.ref-component strong { font-weight: 500; display: block; font-size: 12px; }
.ref-component span { color: var(--text3); font-size: 11px; line-height: 1.4; display: block; margin-top: 1px; }
.ref-empty { font-size: 12px; color: var(--text3); padding: 1rem 0; text-align: center; }

/* Library panel */
.lib-header { padding: 1.1rem 1rem 0.65rem; border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
.lib-header h2 { font-size: 13px; font-weight: 500; }
.lib-header p { font-size: 11px; color: var(--text3); margin-top: 1px; }
.lib-search { padding: 0.6rem 1rem; border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
.lib-search input { width: 100%; padding: 5px 9px; border: 0.5px solid var(--border2); border-radius: var(--radius); background: var(--bg2); color: var(--text); font-size: 12px; outline: none; }
.lib-search input:focus { border-color: var(--accent); background: var(--bg); }

.filter-chip { font-size: 10px; padding: 2px 7px; border-radius: 99px; border: 0.5px solid var(--border2); cursor: pointer; color: var(--text3); background: transparent; transition: all 0.1s; user-select: none; }
.filter-chip.active { color: #fff; border-color: transparent; }
.lib-filter-section { border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
.lib-filter-label { font-size: 10px; color: var(--text3); padding: 5px 1rem 4px; cursor: pointer; user-select: none; display: flex; justify-content: space-between; letter-spacing: 0.03em; text-transform: uppercase; }
.lib-filter-label:hover { color: var(--text2); }
.lib-filters { padding: 0 1rem 6px; display: flex; gap: 4px; flex-wrap: wrap; }
.lib-filters.collapsed { display: none; }
.ritual-list { flex: 1; overflow-y: auto; }
.rli { padding: 8px 1rem; cursor: pointer; border-left: 2px solid transparent; transition: all 0.1s; }
.rli:hover { background: var(--bg2); }
.rli.active { background: var(--bg2); border-left-color: var(--accent); }
.rli-name { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rli-meta { font-size: 10px; color: var(--text3); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lib-empty { padding: 1.5rem 1rem; text-align: center; font-size: 11px; color: var(--text3); line-height: 1.8; }
.lib-count { padding: 5px 1rem; font-size: 10px; color: var(--text3); border-top: 0.5px solid var(--border); flex-shrink: 0; }
.lib-sort { padding: 5px 1rem 6px; border-bottom: 0.5px solid var(--border); flex-shrink: 0; display: flex; align-items: center; gap: 6px; }
.lib-sort-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.03em; flex-shrink: 0; }
.lib-sort select { flex: 1; font-size: 11px; padding: 3px 6px; border: 0.5px solid var(--border2); border-radius: 5px; background: var(--bg2); color: var(--text); outline: none; cursor: pointer; }
.lib-sort-dir { font-size: 13px; cursor: pointer; color: var(--text3); padding: 1px 4px; border-radius: 4px; user-select: none; }
.lib-sort-dir:hover { color: var(--text); background: var(--bg2); }

/* Custom components */
.comp-list-item { display: flex; align-items: flex-start; gap: 8px; padding: 7px 9px; border-radius: var(--radius); background: var(--bg2); border: 0.5px solid var(--border); margin-bottom: 6px; }
.comp-list-item-body { flex: 1; min-width: 0; }
.comp-list-item-name { font-size: 13px; font-weight: 500; }
.comp-list-item-meta { font-size: 11px; color: var(--text3); margin-top: 1px; }
.comp-list-item-desc { font-size: 12px; color: var(--text2); margin-top: 3px; line-height: 1.4; }
.comp-list-item-actions { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
.comp-list-item-actions button { font-size: 11px; padding: 2px 8px; }
.custom-badge { display: inline-block; font-size: 9px; padding: 1px 5px; border-radius: 99px; background: var(--accent); color: #fff; margin-left: 5px; vertical-align: middle; font-weight: 500; letter-spacing: 0.03em; }
.comp-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.comp-form-grid .full { grid-column: 1 / -1; }

#form-msg { font-size: 13px; margin-top: 0.75rem; min-height: 1.4em; }
</style>
</head>
<body>
<div class="app">

  <!-- LEFT: Library -->
  <aside class="lib-panel">
    <div class="lib-header">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;">
        <h2>Library</h2>
      </div>
      <p id="lib-count-sub">0 rituals</p>
    </div>
    <div class="lib-search">
      <input type="text" id="lib-search" placeholder="Search…" oninput="renderLibrary()">
    </div>
    <div class="lib-sort">
      <span class="lib-sort-label">Sort</span>
      <select id="lib-sort-by" onchange="renderLibrary()">
        <option value="date">Date added</option>
        <option value="name">Name</option>
        <option value="tier">Tier</option>
        <option value="primary">Primary rune</option>
        <option value="purpose">Purpose</option>
      </select>
      <span class="lib-sort-dir" id="sort-dir-btn" onclick="toggleSortDir()" title="Toggle sort direction">&#8645;</span>
    </div>
    <div class="lib-filter-section">
      <div class="lib-filter-label" onclick="toggleFilterSection('tier-filters')">Tier <span id="tier-filters-arrow">&#9662;</span></div>
      <div class="lib-filters" id="tier-filters"></div>
    </div>
    <div class="lib-filter-section">
      <div class="lib-filter-label" onclick="toggleFilterSection('purpose-filters')">Purpose <span id="purpose-filters-arrow">&#9662;</span></div>
      <div class="lib-filters" id="purpose-filters"></div>
    </div>
    <div class="lib-filter-section">
      <div class="lib-filter-label" onclick="toggleFilterSection('rune-filters')">Primary rune <span id="rune-filters-arrow">&#9662;</span></div>
      <div class="lib-filters" id="rune-filters"></div>
    </div>
    <div class="ritual-list" id="ritual-list"></div>
    <div class="lib-count" id="lib-count-foot"></div>
  </aside>

  <!-- CENTRE: Main -->
  <main class="main">
    <div class="tabs" id="nav"></div>

    <!-- Add tab -->
    <div id="pane-add">
      <div class="page-title" id="form-add-title">Add a Ritual</div>
      <p class="page-sub" id="form-add-sub">Record a ritual and save it to your library.</p>

      <label class="form-label">Name <span class="required-star">*</span></label>
      <input type="text" id="f-name" placeholder="e.g. Veil of Pale Embers">

      <label class="form-label">Purpose <span class="required-star">*</span></label>
      <select id="f-purpose">
        <option value="">— select —</option>
        <option>Enchantment</option>
        <option>Evocation</option>
        <option>Familiar/Summoning</option>
        <option>Bailiwick</option>
        <option>Boon</option>
      </select>

      <label class="form-label">Primary rune <span class="required-star">*</span></label>
      <div class="pill-group" id="f-primary"></div>

      <label class="form-label">Subsidiary runes <span class="sub-note" id="f-sub-note">(0 — Low tier)</span></label>
      <div class="pill-group" id="f-subs"></div>

      <label class="form-label">Effect <span class="required-star">*</span></label>
      <textarea id="f-effect" placeholder="Describe what the ritual does…"></textarea>

      <div class="btn-row">
        <button class="primary" id="form-save-btn" onclick="saveRitual()">Save to library</button>
        <button onclick="clearForm()">Clear</button>
      </div>
      <div id="form-msg"></div>
    </div>

    <!-- Detail tab -->
    <div id="pane-detail" style="display:none">
      <div id="detail-content"></div>
    </div>

  <!-- Components tab -->
    <div id="pane-comps" style="display:none">
      <div class="page-title">Custom Components</div>
      <p class="page-sub" style="margin-bottom:1.25rem;">Add your own components to any rune. They appear in the reference panel marked <span class="custom-badge" style="font-size:10px;vertical-align:middle;">custom</span>.</p>

      <!-- Add/edit form -->
      <div style="border:0.5px solid var(--border2);border-radius:var(--radius-lg);padding:1.25rem;margin-bottom:1.75rem;">
        <div style="font-size:14px;font-weight:500;margin-bottom:1rem;" id="comp-form-title">Add component</div>
        <div class="comp-form-grid">
          <div>
            <label class="form-label">Name <span class="required-star">*</span></label>
            <input type="text" id="cf-name" maxlength="255" placeholder="e.g. Ember Glass">
          </div>
          <div>
            <label class="form-label">Rune <span class="required-star">*</span></label>
            <select id="cf-rune">
              <option value="">— select —</option>
            </select>
          </div>
          <div>
            <label class="form-label">Tier <span class="required-star">*</span></label>
            <select id="cf-tier">
              <option value="">— select —</option>
              <option>Low</option><option>Mid</option><option>High</option><option>Adept</option>
            </select>
          </div>
          <div class="full">
            <label class="form-label">Description <span class="required-star">*</span></label>
            <textarea id="cf-desc" style="min-height:70px;" placeholder="Describe what this component does…"></textarea>
          </div>
        </div>
        <input type="hidden" id="cf-edit-id">
        <div class="btn-row">
          <button class="primary" id="cf-save-btn" onclick="saveCustomComponent()">Add component</button>
          <button onclick="clearCompForm()">Clear</button>
        </div>
        <div id="comp-form-msg" style="font-size:13px;margin-top:0.6rem;min-height:1.2em;"></div>
      </div>

      <!-- Component list -->
      <div style="font-size:13px;font-weight:500;margin-bottom:10px;">Your custom components <span id="custom-comp-count" style="font-size:11px;color:var(--text3);font-weight:400;"></span></div>
      <div id="custom-comp-list"></div>
    </div>

  </main>

  <!-- RIGHT: Reference -->
  <aside class="ref-panel" id="ref-panel">
    <div class="ref-header">
      <h3>Components</h3>
    </div>
    <div class="ref-search">
      <input type="text" id="ref-search" placeholder="Search components…" oninput="renderRef()">
    </div>
    <div class="ref-rune-tabs" id="ref-tabs"></div>
    <div class="ref-body" id="ref-body"></div>
  </aside>

</div>

<script src="reference-data.js"></script>
<script src="shared.js"></script>
<script>

// ── Data (loaded from the server) ───────────────────────────────────────────

var library = [];
var customComponents = [];
var arraysForBacklinks = [];

async function loadLibrary() { library = await api('GET', '/api/rituals'); renderLibrary(); }
async function loadComponents() { customComponents = await api('GET', '/api/components'); }
// Only needed for the ritual detail view's "used in arrays" backlink —
// kept separate from arrays.html's own richer array state.
async function loadArraysForBacklinks() { arraysForBacklinks = await api('GET', '/api/arrays'); }

async function deleteEntry(id) {
  await api('DELETE', '/api/rituals/' + id);
  if (currentDetailId === id) { currentDetailId = null; switchTab('add'); }
  await loadLibrary();
}

// ── State ────────────────────────────────────────────────────────────────────

var fPrimary = null;
var fSubs = {};
var fEditId = null;
var currentDetailId = null;
var libFilter = null;      // tier
var libPurposeFilter = null;
var libRuneFilter = null;
var libSortDir = 'asc';
var refFilter = null; // selected rune name or null
var detailTabVisible = false;

// ── Tabs ─────────────────────────────────────────────────────────────────────

function renderIndexNav(activeKey) {
  renderNav('nav', activeKey, ['add', 'comps'], switchTab);
  var detailTab = document.createElement('div');
  detailTab.id = 'tab-detail';
  detailTab.className = 'tab' + (activeKey === 'detail' ? ' active' : '');
  detailTab.textContent = 'View Ritual';
  detailTab.style.display = detailTabVisible ? '' : 'none';
  detailTab.onclick = function() { switchTab('detail'); };
  var nav = document.getElementById('nav');
  nav.insertBefore(detailTab, nav.querySelector('.theme-toggle'));
}

function switchTab(tab) {
  ['add', 'comps', 'detail'].forEach(function(t) {
    var pane = document.getElementById('pane-' + t);
    if (pane) pane.style.display = t === tab ? '' : 'none';
  });
  // ref panel only on add, comps, and detail
  var refPanel = document.getElementById('ref-panel');
  if (refPanel) refPanel.style.display = (tab === 'add' || tab === 'comps' || tab === 'detail') ? '' : 'none';
  if (tab === 'comps') { populateCompRuneSelect(); renderCustomCompList(); }
  renderIndexNav(tab);
}

// ── Library sidebar ──────────────────────────────────────────────────────────

function toggleFilterSection(id) {
  var el = document.getElementById(id);
  var arrow = document.getElementById(id + '-arrow');
  el.classList.toggle('collapsed');
  arrow.innerHTML = el.classList.contains('collapsed') ? '&#9656;' : '&#9662;';
}

function renderLibraryFilters() {
  // Tier
  var tierEl = document.getElementById('tier-filters');
  tierEl.innerHTML = '';
  ['Low','Mid','High','Adept'].forEach(function(t) {
    var chip = document.createElement('span');
    chip.className = 'filter-chip' + (libFilter === t ? ' active' : '');
    chip.textContent = t;
    var tc = TIER_COLORS[t];
    chip.style.color = libFilter === t ? '#fff' : tc;
    if (libFilter === t) chip.style.background = tc;
    chip.onclick = function() { libFilter = libFilter === t ? null : t; renderLibrary(); };
    tierEl.appendChild(chip);
  });

  // Purpose
  var purposeEl = document.getElementById('purpose-filters');
  purposeEl.innerHTML = '';
  PURPOSES.forEach(function(p) {
    var chip = document.createElement('span');
    chip.className = 'filter-chip' + (libPurposeFilter === p ? ' active' : '');
    chip.textContent = p;
    if (libPurposeFilter === p) chip.style.background = 'var(--accent)';
    chip.onclick = function() { libPurposeFilter = libPurposeFilter === p ? null : p; renderLibrary(); };
    purposeEl.appendChild(chip);
  });

  // Primary rune
  var runeEl = document.getElementById('rune-filters');
  runeEl.innerHTML = '';
  RUNES.forEach(function(r) {
    var chip = document.createElement('span');
    chip.className = 'filter-chip' + (libRuneFilter === r.name ? ' active' : '');
    var dot = document.createElement('span');
    dot.style.cssText = 'display:inline-block;width:6px;height:6px;border-radius:50%;background:' + r.color + ';margin-right:3px;vertical-align:middle;border:0.5px solid rgba(128,128,128,0.2)';
    chip.appendChild(dot);
    chip.appendChild(document.createTextNode(r.name));
    if (libRuneFilter === r.name) { chip.style.background = r.color; chip.style.color = '#111'; chip.style.borderColor = r.color; }
    chip.onclick = function() { libRuneFilter = libRuneFilter === r.name ? null : r.name; renderLibrary(); };
    runeEl.appendChild(chip);
  });
}

function renderLibrary() {
  var q = document.getElementById('lib-search').value.toLowerCase();
  var items = library.slice();
  if (libFilter)        items = items.filter(function(r) { return r.tier === libFilter; });
  if (libPurposeFilter) items = items.filter(function(r) { return r.purpose === libPurposeFilter; });
  if (libRuneFilter)    items = items.filter(function(r) { return r.primary === libRuneFilter; });
  // Sort
  var sortBy = document.getElementById('lib-sort-by') ? document.getElementById('lib-sort-by').value : 'date';
  var TIER_ORDER = {Low:0, Mid:1, High:2, Adept:3};
  items.sort(function(a, b) {
    var av, bv;
    if (sortBy === 'tier')    { av = TIER_ORDER[a.tier]||0; bv = TIER_ORDER[b.tier]||0; }
    else if (sortBy === 'name')    { av = (a.name||'').toLowerCase(); bv = (b.name||'').toLowerCase(); }
    else if (sortBy === 'primary') { av = (a.primary||'').toLowerCase(); bv = (b.primary||'').toLowerCase(); }
    else if (sortBy === 'purpose') { av = (a.purpose||'').toLowerCase(); bv = (b.purpose||'').toLowerCase(); }
    else { av = a.createdAt||''; bv = b.createdAt||''; }
    var cmp = av < bv ? -1 : av > bv ? 1 : 0;
    return libSortDir === 'desc' ? -cmp : cmp;
  });
  if (q) items = items.filter(function(r) {
    return (r.name||'').toLowerCase().indexOf(q) >= 0 ||
           (r.purpose||'').toLowerCase().indexOf(q) >= 0 ||
           (r.primary||'').toLowerCase().indexOf(q) >= 0 ||
           (r.effect||'').toLowerCase().indexOf(q) >= 0;
  });
  var list = document.getElementById('ritual-list');
  list.innerHTML = '';
  if (items.length === 0) {
    var empty = document.createElement('div');
    empty.className = 'lib-empty';
    empty.textContent = library.length === 0 ? 'No rituals yet.\nAdd one using the form.' : 'No results.';
    list.appendChild(empty);
  } else {
    items.forEach(function(r) {
      var div = document.createElement('div');
      div.className = 'rli' + (r.id === currentDetailId ? ' active' : '');
      var tc = TIER_COLORS[r.tier] || '#999';
      var nameEl = document.createElement('div'); nameEl.className = 'rli-name'; nameEl.textContent = r.name;
      var metaEl = document.createElement('div'); metaEl.className = 'rli-meta';
      var tierSpan = document.createElement('span');
      tierSpan.style.color = tc; tierSpan.style.fontWeight = '500'; tierSpan.textContent = r.tier;
      metaEl.appendChild(tierSpan);
      metaEl.appendChild(document.createTextNode(' · ' + r.purpose + ' · ' + r.primary));
      div.appendChild(nameEl); div.appendChild(metaEl);
      div.onclick = function() { openDetail(r.id); };
      list.appendChild(div);
    });
  }
  var total = library.length;
  document.getElementById('lib-count-sub').textContent = total + ' ritual' + (total !== 1 ? 's' : '');
  document.getElementById('lib-count-foot').textContent = items.length !== total ? 'Showing ' + items.length + ' of ' + total : total + ' total';
  renderLibraryFilters();
}

// ── Detail view ───────────────────────────────────────────────────────────────

function openDetail(id) {
  var r = null;
  for (var i = 0; i < library.length; i++) { if (library[i].id === id) { r = library[i]; break; } }
  if (!r) return;
  currentDetailId = id;
  renderLibrary();

  var pr = null;
  for (var j = 0; j < RUNES.length; j++) { if (RUNES[j].name === r.primary) { pr = RUNES[j]; break; } }
  var ignored = IGNORES[r.primary] || [];
  var subs = r.subs || [];
  var activeSubs = subs.filter(function(s) { return ignored.indexOf(s) < 0; });
  var tc = TIER_COLORS[r.tier] || '#999';

  var chipHTML = '';
  if (pr) chipHTML += '<span class="rune-chip"><span class="dot" style="background:' + pr.color + '"></span>' + r.primary + '</span>';
  activeSubs.forEach(function(s) {
    var sr = null;
    for (var k = 0; k < RUNES.length; k++) { if (RUNES[k].name === s) { sr = RUNES[k]; break; } }
    chipHTML += '<span class="rune-chip" style="color:var(--text3)">+ <span class="dot" style="background:' + (sr ? sr.color : '#ccc') + '"></span>' + s + '</span>';
  });

  var html = '<div class="card">';
  html += '<div class="detail-top">';
  html += '<div><div class="ritual-name">' + esc(r.name) + '</div>';
  html += '<div style="margin-bottom:8px">';
  html += '<span class="badge" style="background:' + tc + '22;color:' + tc + ';border:0.5px solid ' + tc + '44">' + r.tier + '</span>';
  html += '<span class="badge" style="background:var(--bg2);color:var(--text2);border:0.5px solid var(--border)">' + esc(r.purpose) + '</span>';
  html += '</div></div>';
  html += '<div style="display:flex;gap:6px;align-items:center;">';
  html += '<button onclick="editEntry(\'' + r.id + '\')">Edit</button>';
  html += '<button class="danger" onclick="confirmDelete(\'' + r.id + '\')">Delete</button>';
  html += '</div>';
  html += '</div>';
  html += '<div class="rune-row">' + chipHTML + '</div>';
  html += '<hr class="hdivider">';
  html += '<div class="fl">Effect</div><div class="fv">' + esc(r.effect || '') + '</div>';
  var d = new Date(r.createdAt);
  html += '<div style="margin-top:0.5rem;font-size:11px;color:var(--text3)">Added ' + d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}) + ' · ' + subs.length + ' subsidiary rune' + (subs.length !== 1 ? 's' : '') + '</div>';

  var usedIn = arraysForBacklinks.filter(function(a) {
    return (a.placements || []).some(function(p) { return p.ritualId === r.id; });
  });
  if (usedIn.length > 0) {
    html += '<div class="fl" style="margin-top:0.85rem;">Used in arrays</div>';
    html += '<div class="fv" style="margin-bottom:0;">' + usedIn.map(function(a) {
      return '<a href="arrays.html?open=' + encodeURIComponent(a.id) + '" style="color:var(--accent)">' + esc(a.name) + '</a>';
    }).join(', ') + '</div>';
  }
  html += '</div>';

  document.getElementById('detail-content').innerHTML = html;
  detailTabVisible = true;
  switchTab('detail');
}

async function confirmDelete(id) {
  var r = null;
  for (var i = 0; i < library.length; i++) { if (library[i].id === id) { r = library[i]; break; } }
  if (!r) return;
  if (confirm('Delete "' + r.name + '"?')) await deleteEntry(id);
}

function editEntry(id) {
  var r = null;
  for (var i = 0; i < library.length; i++) { if (library[i].id === id) { r = library[i]; break; } }
  if (!r) return;
  fEditId = id;
  document.getElementById('f-name').value = r.name;
  document.getElementById('f-purpose').value = r.purpose;
  document.getElementById('f-effect').value = r.effect || '';
  fPrimary = r.primary;
  fSubs = {};
  (r.subs || []).forEach(function(s) { fSubs[s] = true; });
  renderFormPrimary();
  renderFormSubs();
  document.getElementById('form-add-title').textContent = 'Edit Ritual';
  document.getElementById('form-add-sub').textContent = 'Update the details below and save.';
  document.getElementById('form-save-btn').textContent = 'Save changes';
  document.getElementById('form-msg').textContent = '';
  switchTab('add');
}

// ── Form rune selectors ───────────────────────────────────────────────────────

function renderFormPrimary() {
  var g = document.getElementById('f-primary');
  g.innerHTML = '';
  RUNES.forEach(function(r) {
    var el = document.createElement('span');
    el.className = 'tag' + (fPrimary === r.name ? ' on' : '');
    var dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = r.color;
    el.appendChild(dot); el.appendChild(document.createTextNode(r.name));
    el.onclick = function() {
      if (fPrimary === r.name) { fPrimary = null; fSubs = {}; }
      else { fPrimary = r.name; var ign=IGNORES[r.name]||[]; var ns={}; Object.keys(fSubs).forEach(function(s){if(s!==r.name&&ign.indexOf(s)<0)ns[s]=true;}); fSubs=ns; }
      renderFormPrimary(); renderFormSubs();
    };
    g.appendChild(el);
  });
}

function renderFormSubs() {
  var g = document.getElementById('f-subs');
  g.innerHTML = '';
  var ignored = fPrimary ? (IGNORES[fPrimary]||[]) : [];
  var count = Object.keys(fSubs).length;
  var tier = getTier(count);
  var tc = TIER_COLORS[tier];
  var note = document.getElementById('f-sub-note');
  note.textContent = '(' + count + ' — ' + tier + ' tier)';
  note.style.color = tc;
  RUNES.forEach(function(r) {
    if (r.name === fPrimary) return;
    var isIgnored = ignored.indexOf(r.name) >= 0;
    var isSel = !!fSubs[r.name];
    var tooMany = !isSel && count >= 18;
    var el = document.createElement('span');
    el.className = 'tag' + (isSel?' on':'') + (isIgnored||!fPrimary||tooMany?' off':'');
    var dot = document.createElement('span'); dot.className='dot'; dot.style.background=r.color;
    el.appendChild(dot); el.appendChild(document.createTextNode(r.name+(isIgnored?' ✕':'')));
    if (isIgnored) el.title = 'Ignored by ' + fPrimary;
    el.onclick = function() {
      if (fSubs[r.name]) delete fSubs[r.name];
      else if (Object.keys(fSubs).length < 18) fSubs[r.name] = true;
      renderFormSubs();
    };
    g.appendChild(el);
  });
}

// ── Save / clear form ─────────────────────────────────────────────────────────

async function saveRitual() {
  var name    = document.getElementById('f-name').value.trim();
  var purpose = document.getElementById('f-purpose').value;
  var effect  = document.getElementById('f-effect').value.trim();
  if (!name)    { showMsg('Please enter a ritual name.', '#dc2626'); return; }
  if (!purpose) { showMsg('Please select a purpose.', '#dc2626'); return; }
  if (!fPrimary){ showMsg('Please select a primary rune.', '#dc2626'); return; }
  if (!effect)  { showMsg('Please describe the effect.', '#dc2626'); return; }
  var subs = Object.keys(fSubs);
  var payload = { name: name, purpose: purpose, primary: fPrimary, subs: subs, effect: effect };

  try {
    if (fEditId) {
      await api('PUT', '/api/rituals/' + fEditId, payload);
      await loadLibrary();
      showMsg('"' + name + '" updated!', 'var(--accent)');
      var savedId = fEditId;
      setTimeout(function() { clearForm(); openDetail(savedId); }, 1000);
    } else {
      await api('POST', '/api/rituals', payload);
      await loadLibrary();
      showMsg('"' + name + '" saved!', 'var(--accent)');
      setTimeout(function() { clearForm(); }, 1200);
    }
  } catch (e) {
    showMsg(e.message, '#dc2626');
  }
}

function showMsg(text, color) {
  var el = document.getElementById('form-msg');
  el.textContent = text; el.style.color = color;
}

function clearForm() {
  document.getElementById('f-name').value = '';
  document.getElementById('f-purpose').value = '';
  document.getElementById('f-effect').value = '';
  document.getElementById('form-msg').textContent = '';
  fPrimary = null; fSubs = {}; fEditId = null;
  document.getElementById('form-add-title').textContent = 'Add a Ritual';
  document.getElementById('form-add-sub').textContent = 'Record a ritual and save it to your library.';
  document.getElementById('form-save-btn').textContent = 'Save to library';
  renderFormPrimary(); renderFormSubs();
}

// ── Reference panel ───────────────────────────────────────────────────────────

function renderRefTabs() {
  var el = document.getElementById('ref-tabs');
  el.innerHTML = '';
  RUNES.forEach(function(r) {
    var chip = document.createElement('span');
    chip.className = 'ref-tab' + (refFilter === r.name ? ' active' : '');
    chip.textContent = r.name;
    if (refFilter === r.name) { chip.style.background = r.color; chip.style.color = '#111'; }
    chip.onclick = function() { refFilter = refFilter === r.name ? null : r.name; renderRef(); };
    el.appendChild(chip);
  });
}

function allComponents() {
  return COMPONENTS.concat(customComponents);
}

function renderRef() {
  var q = document.getElementById('ref-search').value.toLowerCase();
  var body = document.getElementById('ref-body');
  body.innerHTML = '';

  var runesToShow = refFilter ? RUNES.filter(function(r){return r.name===refFilter;}) : RUNES;
  var anyShown = false;

  runesToShow.forEach(function(rune) {
    var comps = allComponents().filter(function(c) {
      if (c.rune !== rune.name) return false;
      if (!q) return true;
      return c.name.toLowerCase().indexOf(q) >= 0 || c.desc.toLowerCase().indexOf(q) >= 0;
    });
    if (comps.length === 0) return;
    anyShown = true;

    var block = document.createElement('div');
    block.className = 'ref-rune-block';

    var nameEl = document.createElement('div');
    nameEl.className = 'ref-rune-name';
    var dot = document.createElement('span'); dot.className = 'ref-dot'; dot.style.background = rune.color;
    nameEl.appendChild(dot);
    nameEl.appendChild(document.createTextNode(rune.name));
    block.appendChild(nameEl);

    var tiers = ['Low','Mid','High','Adept'];
    tiers.forEach(function(tier) {
      var tierComps = comps.filter(function(c){return c.tier===tier;});
      if (tierComps.length === 0) return;
      var tierLabel = document.createElement('div');
      tierLabel.className = 'ref-tier';
      tierLabel.textContent = tier;
      tierLabel.style.color = TIER_COLORS[tier];
      block.appendChild(tierLabel);
      tierComps.forEach(function(c) {
        var card = document.createElement('div');
        card.className = 'ref-component';
        var strong = document.createElement('strong'); strong.textContent = c.name;
        var span = document.createElement('span'); span.textContent = c.desc;
        card.appendChild(strong); card.appendChild(span);
        block.appendChild(card);
      });
    });

    body.appendChild(block);
  });

  if (!anyShown) {
    var empty = document.createElement('div');
    empty.className = 'ref-empty';
    empty.textContent = 'No components found.';
    body.appendChild(empty);
  }

  renderRefTabs();
}

// ── Sort ─────────────────────────────────────────────────────────────────────

function toggleSortDir() {
  libSortDir = libSortDir === 'asc' ? 'desc' : 'asc';
  var btn = document.getElementById('sort-dir-btn');
  if (btn) btn.textContent = libSortDir === 'asc' ? '⇅' : '⇅';
  btn.style.color = libSortDir === 'desc' ? 'var(--accent)' : 'var(--text3)';
  renderLibrary();
}

// ── Custom components ────────────────────────────────────────────────────────

function populateCompRuneSelect() {
  var sel = document.getElementById('cf-rune');
  if (!sel || sel.options.length > 1) return;
  RUNES.forEach(function(r) {
    var opt = document.createElement('option');
    opt.value = r.name;
    opt.textContent = r.name;
    sel.appendChild(opt);
  });
}

async function saveCustomComponent() {
  var name  = document.getElementById('cf-name').value.trim();
  var rune  = document.getElementById('cf-rune').value;
  var tier  = document.getElementById('cf-tier').value;
  var desc  = document.getElementById('cf-desc').value.trim();
  var editId = document.getElementById('cf-edit-id').value;
  var msg = document.getElementById('comp-form-msg');

  if (!name) { msg.textContent = 'Please enter a name.'; msg.style.color = '#dc2626'; return; }
  if (!rune) { msg.textContent = 'Please select a rune.'; msg.style.color = '#dc2626'; return; }
  if (!tier) { msg.textContent = 'Please select a tier.'; msg.style.color = '#dc2626'; return; }
  if (!desc) { msg.textContent = 'Please enter a description.'; msg.style.color = '#dc2626'; return; }

  var payload = { name: name, rune: rune, tier: tier, desc: desc };

  try {
    if (editId) {
      await api('PUT', '/api/components/' + editId, payload);
      msg.textContent = 'Component updated.';
      msg.style.color = 'var(--accent)';
      document.getElementById('comp-form-title').textContent = 'Add component';
      document.getElementById('cf-save-btn').textContent = 'Add component';
      document.getElementById('cf-edit-id').value = '';
    } else {
      await api('POST', '/api/components', payload);
      msg.textContent = '"' + name + '" added.';
      msg.style.color = 'var(--accent)';
    }
  } catch (e) {
    msg.textContent = e.message;
    msg.style.color = '#dc2626';
    return;
  }

  await loadComponents();

  setTimeout(function() {
    if (!document.getElementById('cf-edit-id').value) clearCompForm();
    else { msg.textContent = ''; }
  }, 1200);

  renderCustomCompList();
  renderRef();
}

function editCustomComponent(id) {
  var c = null;
  for (var i = 0; i < customComponents.length; i++) { if (customComponents[i].id === id) { c = customComponents[i]; break; } }
  if (!c) return;
  document.getElementById('cf-name').value = c.name;
  document.getElementById('cf-rune').value = c.rune;
  document.getElementById('cf-tier').value = c.tier;
  document.getElementById('cf-desc').value = c.desc;
  document.getElementById('cf-edit-id').value = c.id;
  document.getElementById('comp-form-title').textContent = 'Edit component';
  document.getElementById('cf-save-btn').textContent = 'Save changes';
  document.getElementById('comp-form-msg').textContent = '';
  window.scrollTo(0, 0);
}

async function deleteCustomComponent(id) {
  var c = null;
  for (var i = 0; i < customComponents.length; i++) { if (customComponents[i].id === id) { c = customComponents[i]; break; } }
  if (!c || !confirm('Delete "' + c.name + '"?')) return;
  await api('DELETE', '/api/components/' + id);
  await loadComponents();
  renderCustomCompList();
  renderRef();
}

function clearCompForm() {
  document.getElementById('cf-name').value = '';
  document.getElementById('cf-rune').value = '';
  document.getElementById('cf-tier').value = '';
  document.getElementById('cf-desc').value = '';
  document.getElementById('cf-edit-id').value = '';
  document.getElementById('comp-form-title').textContent = 'Add component';
  document.getElementById('cf-save-btn').textContent = 'Add component';
  document.getElementById('comp-form-msg').textContent = '';
}

function renderCustomCompList() {
  var el = document.getElementById('custom-comp-list');
  var countEl = document.getElementById('custom-comp-count');
  if (!el) return;
  if (countEl) countEl.textContent = '(' + customComponents.length + ')';
  el.innerHTML = '';
  if (customComponents.length === 0) {
    el.innerHTML = '<div style="font-size:13px;color:var(--text3);padding:1rem 0;">No custom components yet.</div>';
    return;
  }
  // Group by rune
  var byRune = {};
  customComponents.forEach(function(c) {
    if (!byRune[c.rune]) byRune[c.rune] = [];
    byRune[c.rune].push(c);
  });
  Object.keys(byRune).sort().forEach(function(runeName) {
    var rune = null;
    for (var i = 0; i < RUNES.length; i++) { if (RUNES[i].name === runeName) { rune = RUNES[i]; break; } }
    var header = document.createElement('div');
    header.style.cssText = 'font-size:12px;font-weight:600;margin:12px 0 6px;display:flex;align-items:center;gap:6px;';
    if (rune) {
      var dot = document.createElement('span');
      dot.style.cssText = 'width:8px;height:8px;border-radius:50%;background:' + rune.color + ';display:inline-block;border:0.5px solid rgba(128,128,128,0.2);';
      header.appendChild(dot);
    }
    header.appendChild(document.createTextNode(runeName));
    el.appendChild(header);

    byRune[runeName].forEach(function(c) {
      var item = document.createElement('div');
      item.className = 'comp-list-item';
      var body = document.createElement('div'); body.className = 'comp-list-item-body';
      var nameEl = document.createElement('div'); nameEl.className = 'comp-list-item-name'; nameEl.textContent = c.name;
      var metaEl = document.createElement('div'); metaEl.className = 'comp-list-item-meta';
      metaEl.textContent = c.tier;
      metaEl.style.color = TIER_COLORS[c.tier] || 'var(--text3)';
      var descEl = document.createElement('div'); descEl.className = 'comp-list-item-desc'; descEl.textContent = c.desc;
      body.appendChild(nameEl); body.appendChild(metaEl); body.appendChild(descEl);
      var actions = document.createElement('div'); actions.className = 'comp-list-item-actions';
      var editBtn = document.createElement('button'); editBtn.textContent = 'Edit';
      editBtn.onclick = (function(id) { return function() { editCustomComponent(id); }; })(c.id);
      var delBtn = document.createElement('button'); delBtn.textContent = 'Delete'; delBtn.className = 'danger';
      delBtn.onclick = (function(id) { return function() { deleteCustomComponent(id); }; })(c.id);
      actions.appendChild(editBtn); actions.appendChild(delBtn);
      item.appendChild(body); item.appendChild(actions);
      el.appendChild(item);
    });
  });
}

// ── Init ─────────────────────────────────────────────────────────────────────

async function init() {
  renderFormPrimary();
  renderFormSubs();
  await Promise.all([loadLibrary(), loadComponents(), loadArraysForBacklinks()]);
  renderRef();
  renderCustomCompList();
  if (window.location.hash === '#comps') switchTab('comps');
  else renderIndexNav('add');
}
init();
</script>
